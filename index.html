<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0e13" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="GexVex" />
  <title>GexVex Live</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --panel: #0a0e13;
      --border: #1d283b;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --purple: #7e22ce;
      --slate: #234f6e;
      --yellow: #facc15;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto Mono', monospace; }
    body { background: var(--bg); color: var(--text); padding-bottom: 70px; -webkit-font-smoothing: antialiased; }
    header {
      position: sticky; top: 0; z-index: 30; background: var(--panel);
      border-bottom: 1px solid var(--border); padding: 10px 12px; height: 42px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .title { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; color: #fff; }
    .stamp { font-size: 11px; color: var(--yellow); text-align: right; }
    .stamp.stale { color: #f87171; font-weight: 700; }
    .stale-banner {
      display: none; padding: 8px 12px; background: #450a0a; color: #fecaca;
      border-bottom: 1px solid #7f1d1d; font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
    }
    .stale-banner.show { display: block; }
    .pills {
      display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px;
      background: #05070a; border-bottom: 1px solid var(--border);
    }
    .pill {
      padding: 6px 11px; border: 1px solid var(--border); background: var(--panel);
      color: var(--muted); font-size: 12px; font-weight: 700; border-radius: 4px; cursor: pointer;
    }
    .pill.active { background: #fff; color: #000; border-color: #fff; }
    .mode-switch {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      padding: 8px 10px; background: #05070a; border-bottom: 1px solid var(--border);
    }
    .mode-btn {
      padding: 9px 10px; border: 1px solid var(--border); background: var(--panel);
      color: var(--muted); font-size: 12px; font-weight: 700; border-radius: 4px;
      cursor: pointer; letter-spacing: 0.4px;
    }
    .mode-btn.active {
      background: var(--yellow); color: #000000; border-color: var(--yellow);
    }
    .summary-bar {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      padding: 10px 10px 8px; background: var(--panel); border-bottom: 1px solid var(--border);
      font-size: 11px;
    }
    .stat span { display: block; color: var(--muted); font-size: 10px; margin-bottom: 2px; }
    .stat strong { font-size: 13px; }
    .matrix-scroll { overflow-x: auto; width: 100%; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th {
      background: var(--panel); color: var(--muted); font-weight: 600;
      padding: 7px 6px; border-bottom: 1px solid var(--border); border-right: 1px solid #131c2b;
      text-align: right; position: sticky; top: 42px; z-index: 15; white-space: nowrap;
    }
    th:first-child, td:first-child { text-align: left; padding-left: 10px; }
    .matrix-table th {
      position: sticky; top: 42px; z-index: 18; background: var(--panel);
    }
    .matrix-table th:first-child,
    .matrix-table td:first-child {
      position: sticky; left: 0; background: var(--panel);
      border-right: 1px solid var(--border);
    }
    .matrix-table td:first-child { z-index: 16; }
    .matrix-table th:first-child { top: 42px; z-index: 24; }
    td {
      padding: 7px 6px; border-bottom: 1px solid #111827; border-right: 1px solid #0f172a;
      text-align: right; white-space: nowrap;
    }
    table:not(.hs) tr.spot-row td { background: #ffffff !important; color: #000000 !important; font-weight: 700; }
    table.hs tr.spot-row td.node { font-weight: 800; }
    .king-cell { font-weight: 700; }
    .badge-call { background: rgba(34, 197, 94, 0.2); color: #4ade80; padding: 2px 5px; border-radius: 3px; font-weight: 700; }
    .badge-put { background: rgba(244, 63, 94, 0.2); color: #fb7185; padding: 2px 5px; border-radius: 3px; font-weight: 700; }
    .magnet-flag { color: var(--yellow); font-weight: 700; }
    .section-head {
      padding: 8px 10px; background: #0a0e13; border-top: 1px solid #1d283b; border-bottom: 1px solid #1d283b;
      font-size: 11px; font-weight: 700; color: #facc15; margin-top: 8px;
      display: flex; justify-content: space-between; gap: 8px;
    }
    .section-head:first-child { margin-top: 0; border-top: none; }
    .section-head .sub { color: var(--muted); font-weight: 400; }
    .str-strong { color: #4ade80; font-weight: 700; }
    .str-moderate { color: #facc15; font-weight: 700; }
    .str-weak { color: #94a3b8; font-weight: 700; }
    .up { color: #4ade80; }
    .down { color: #fb7185; }
    tr.active-row td { background: #111827; }
    tr.magnet-row td { background: #1c1606; }
    .ghost-tag { color: #ffffff; font-weight: 700; text-shadow: 0 0 6px rgba(255,255,255,0.7); }
    .regime-pos { color: #4ade80; }
    .wall-tag { display: inline-block; font-size: 8px; font-weight: 700; padding: 0 2px; border-radius: 2px; line-height: 1.3; vertical-align: 1px; }
    tr.flip-edge td { border-top: 2px solid rgba(56, 189, 248, 0.75); }
    tr.em-edge td { border-top: 2px dashed rgba(167, 139, 250, 0.7); }
    tr.sig1-edge td { border-top: 2px dotted rgba(148, 163, 184, 0.6); }
    tr.sig2-edge td { border-top: 2px dotted rgba(251, 191, 36, 0.85); }
    .lvl-sig { color: #94a3b8; }
    .heat-tag.extreme { color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.5); }
    .roll { font-size: 9px; font-weight: 700; }
    .levels-bar { padding: 4px 10px 6px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 10px; color: var(--muted); white-space: nowrap; overflow-x: auto; }
    .lvl-flip { color: #38bdf8; }
    .lvl-em { color: #a78bfa; }
    .heat-tag { font-size: 9px; font-weight: 700; padding: 0 3px; border-radius: 2px; background: rgba(255,255,255,0.06); white-space: nowrap; }
    .heat-tag.chop { color: #fbbf24; }
    .heat-tag.gradeA { color: #000; background: #4ade80; }
    .heat-tag.gradeB { color: #4ade80; }
    .heat-tag.bear.gradeA { background: #fb7185; }
    .heat-tag.bear.gradeB { color: #fb7185; }
    /* Heatmap-read study: node velocity, map patterns, setup cards (visual only, no alerts) */
    .vel { display: inline-block; font-size: 8px; font-weight: 700; padding: 0 2px; border-radius: 2px; line-height: 1.3; vertical-align: 1px; }
    .vel.pop { color: #000; background: #4ade80; }
    .vel.pop.wall { background: #fbbf24; }
    .vel.vanish { color: #fff; background: #ef4444; }
    .pat-mark { font-size: 8px; font-weight: 700; color: #94a3b8; vertical-align: 1px; }
    .pat-mark.rug { color: #fb7185; }
    .pat-mark.rev { color: #4ade80; }
    .pat-mark.gk { color: #67e8f9; }
    .heat-tag.reg-RAINBOW { color: #000; background: linear-gradient(90deg,#f87171,#fbbf24,#4ade80,#60a5fa,#a78bfa); }
    .heat-tag.reg-PIN { color: #fbbf24; }
    .heat-tag.reg-TREND { color: #4ade80; }
    .heat-tag.reg-RANGE { color: #67e8f9; }
    .heat-tag.reg-WHIPSAW { color: #f0abfc; }
    .heat-tag.rug { color: #fb7185; }
    .heat-tag.rev { color: #4ade80; }
    .setups { padding: 6px 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px; }
    .setup { border: 1px solid var(--border); border-left: 3px solid #64748b; background: var(--panel); padding: 5px 7px; font-size: 10px; line-height: 1.45; }
    .setup.up { border-left-color: #4ade80; }
    .setup.down { border-left-color: #fb7185; }
    .setup .sh { display: flex; gap: 6px; align-items: baseline; font-size: 11px; }
    .setup .sh b { font-size: 12px; }
    .setup .st { margin-left: auto; font-size: 9px; font-weight: 700; color: #94a3b8; }
    .setup .st.HIT { color: #4ade80; } .setup .st.INVALID { color: #fb7185; } .setup .st.OPEN { color: #fbbf24; }
    .setup .why { color: var(--muted); }
    table.score td, table.score th { font-size: 10px; padding: 3px 6px; }
    /* Heat-seeker style node tables */
    .hs-controls { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: #05070a; border-bottom: 1px solid var(--border); font-size: 10px; color: var(--muted); }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .seg button { background: var(--panel); color: var(--muted); border: none; font: inherit; font-size: 11px; font-weight: 700; padding: 4px 10px; cursor: pointer; }
    .seg button.on { background: var(--yellow); color: #000; }
    table.hs { table-layout: fixed; }
    table.hs th { padding: 5px 6px; }
    table.hs td { padding: 5px 6px; border-bottom: 1px solid rgba(0,0,0,0.45); border-right: none; }
    table.hs td.strike { background: #07090d; color: #cbd5e1; text-align: left; font-weight: 600; }
    table.hs td.strike .sp { display: inline-block; background: #fff; color: #000; font-weight: 700; padding: 0 9px 0 4px; clip-path: polygon(0 0, 78% 0, 100% 50%, 78% 100%, 0 100%); }
    .nc { display: flex; justify-content: space-between; align-items: center; gap: 3px; }
    .nc .nv { margin-left: auto; }
    .dbadge { font-size: 8px; font-weight: 700; padding: 0 2px; border-radius: 2px; background: rgba(0,0,0,0.55); line-height: 1.4; }
    .dbadge.dup { color: #4ade80; }
    .dbadge.ddn { color: #f87171; }
    .tri-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; background: #000; padding: 0 14px 0 2px; }
    .tri-col { min-width: 0; }
    .tri-head { background: var(--panel); border-bottom: 1px solid var(--border); padding: 5px 4px; font-size: 10px; line-height: 1.45; position: sticky; top: 42px; z-index: 5; }
    .tri-head b { color: #fff; font-size: 11px; }
    .muted { color: var(--muted); }
    .tri-head .muted { color: var(--muted); font-size: 9px; }
    .tri-head .kdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #fde725; margin-right: 3px; vertical-align: 1px; }
    table.tri { font-size: 10px; }
    table.tri td { padding: 5px 2px; overflow: hidden; }
    table.tri td.strike { width: 30%; font-size: 10px; padding-left: 3px; }
    table.tri .nc { gap: 1px; }
    table.tri td.strike .sp { padding: 0 7px 0 2px; }
    table.tri .dbadge { font-size: 8px; padding: 0 1px; letter-spacing: -0.3px; }
    tr.pad td { background: #000 !important; border-bottom-color: #000; }
    .wall-cw { background: #14532d; color: #86efac; }
    .dp-tag { display: inline-block; font-size: 8px; font-weight: 700; padding: 0 2px; border-radius: 2px; line-height: 1.3; vertical-align: 1px; background: #1e293b; color: #94a3b8; }
    .dp-tag.dp-node { background: #0e7490; color: #ecfeff; }
    .st-still { color: #4ade80; } .st-trim { color: #fbbf24; } .st-exit { color: #f87171; } .st-muted { color: #64748b; }
    .wall-pw { background: #7f1d1d; color: #fecaca; }
    .regime-neg { color: #fb7185; }
    .matrix-scroll table:not(.matrix-table) th { position: static; }
    .signal-cell { text-align: left; font-size: 10px; white-space: normal; min-width: 120px; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 6px 10px; font-size: 10px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .chart-legend b { font-weight: 700; }
    .chart-tf { display: flex; gap: 6px; padding: 6px 10px; background: #05070a; border-bottom: 1px solid var(--border); align-items: center; }
    .chart-tf .flow-chip { padding: 4px 9px; }
    .chart-note { margin-left: auto; font-size: 9px; color: var(--muted); }
    #chartBox { height: calc(100vh - 230px); min-height: 260px; }
    .empty-msg { padding: 18px 12px; color: var(--muted); font-size: 11px; border-bottom: 1px solid #111827; }
    nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
      background: var(--panel); border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(5, 1fr); z-index: 30;
    }
    nav button {
      background: none; border: none; color: var(--muted); font-size: 10px;
      font-weight: 700; cursor: pointer; border-right: 1px solid var(--border);
    }
    nav button.active { color: var(--yellow); background: #111827; }
    .flow-presets {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
      padding: 8px 10px; background: #05070a; border-bottom: 1px solid var(--border);
    }
    .flow-presets .mode-btn { padding: 8px 4px; font-size: 10px; }
    .flow-controls {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end;
      padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--border);
    }
    .flow-field { display: flex; flex-direction: column; gap: 2px; font-size: 9px; color: var(--muted); }
    .flow-field input {
      background: #05070a; border: 1px solid var(--border); color: #fff; font-size: 12px;
      padding: 5px 6px; border-radius: 4px;
    }
    .flow-chip {
      padding: 6px 8px; border: 1px solid var(--border); background: #05070a; color: var(--muted);
      font-size: 10px; font-weight: 700; border-radius: 4px; cursor: pointer;
    }
    .flow-chip.on { background: var(--yellow); color: #000; border-color: var(--yellow); }
    .setup-box { padding: 20px; text-align: center; }
    .setup-box input {
      width: 100%; padding: 10px; margin: 10px 0; background: var(--panel);
      border: 1px solid var(--border); color: #fff; font-size: 12px;
    }
    .setup-box button { padding: 10px 16px; background: var(--yellow); color: #000; border: none; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <div class="title">GEX/VEX LIVE <span style="color:#94a3b8;font-size:10px;">v3.4</span></div>
    <div class="stamp" id="statusStamp">CONNECTING...</div>
  </header>

  <div id="setupScreen" class="setup-box" style="display:none;">
    <p style="font-size:12px;color:#94a3b8;">Paste your Secret Gist ID once (saved locally on your phone):</p>
    <input id="gistInput" placeholder="e.g. f9f6506d780efb0df175de3cc42d60e1" />
    <button onclick="saveGistId()">SAVE & CONNECT</button>
  </div>

  <div id="appContent">
    <div class="stale-banner" id="staleBanner"></div>
    <div class="pills" id="tickerPills"></div>
    <div id="viewContainer"></div>
  </div>

  <nav>
    <button id="tab-0dte" class="active" onclick="setTab('0dte')">0DTE MAP</button>
    <button id="tab-7dte" onclick="setTab('7dte')">SCANNERS</button>
    <button id="tab-weekly" onclick="setTab('weekly')">WEEKLY OPEX</button>
    <button id="tab-flow" onclick="setTab('flow')">FLOW</button>
    <button id="tab-chart" onclick="setTab('chart')">CHART</button>
  </nav>

  <script>
    const TICKERS = ["SPY", "QQQ", "SMH", "VIX", "TSLA", "AAPL", "NVDA"];
    let activeTab = "0dte";
    let activeTicker = "SPY";
    let weeklyMode = "gex";
    const WEEKLY_TICKERS = ["SPY", "QQQ", "SPX", "SMH", "TSLA", "AAPL", "NVDA", "VIX"];
    const ZERO_TICKERS = ["SPY", "SPX", "QQQ", "SMH", "VIX", "TSLA", "AAPL", "NVDA"];
    const TRINITY = ["SPY", "SPX", "QQQ"];
    const pref = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
    const savePref = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
    let zeroView = pref("gexvex_zero_view", "TRINITY");  // "TRINITY" or one 0DTE ticker
    let weeklyTicker = pref("gexvex_weekly_ticker", "SPY");
    let deltaTf = pref("gexvex_delta_tf", "10m");        // % change badges on nodes: "10m" | "1h"
    let triGreek = pref("gexvex_tri_greek", "gex");      // what the Trinity columns show
    let liveData = null;
    let lastError = "";
    let countdown = 30;
    // The bot writes server_ts (epoch seconds) into every Gist snapshot.
    // Treat data older than this as stale and replace the LIVE label.
    const STALE_AFTER_SEC = 120;

    function fmtAge(sec) {
      if (sec < 60) return `${sec}s`;
      const m = Math.floor(sec / 60);
      if (m < 60) return `${m}m`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h ${m % 60}m`;
      const d = Math.floor(h / 24);
      return `${d}d ${h % 24}h`;
    }

    function renderStatus() {
      const stampEl = document.getElementById("statusStamp");
      const bannerEl = document.getElementById("staleBanner");
      const ts = Number(liveData?.server_ts);
      let label, stale = false, banner = "";

      if (ts > 0) {
        const age = Math.max(0, Math.floor(Date.now() / 1000 - ts));
        if (age > STALE_AFTER_SEC) {
          stale = true;
          label = `STALE • ${fmtAge(age)} OLD`;
          const when = new Date(ts * 1000).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
          banner = `⚠ DATA IS ${fmtAge(age).toUpperCase()} OLD (last update ${when}). `
            + (lastError ? `Fetch error: ${lastError}.` : "Bot may be stopped or market closed.");
        } else {
          label = `${lastError ? "ERR" : "LIVE"} ${liveData?.zero_dte?.updated_at || ""}`.trim();
        }
      } else if (liveData) {
        // Older snapshot without server_ts: age unknown, keep the bot's own stamp.
        label = liveData.zero_dte?.updated_at || "AGE UNKNOWN";
      } else {
        label = lastError ? "ERR" : "CONNECTING...";
      }
      if (lastError && liveData && !(ts > 0)) label = `ERR • ${label}`;

      stampEl.textContent = `${label} • ${countdown}s`;
      stampEl.classList.toggle("stale", stale);
      bannerEl.textContent = banner;
      bannerEl.classList.toggle("show", stale);
    }

    function getGistId() {
      const p = new URLSearchParams(window.location.search).get("gist");
      if (p) { localStorage.setItem("gexvex_gist_id", p.trim()); return p.trim(); }
      return (localStorage.getItem("gexvex_gist_id") || "").trim();
    }

    function saveGistId() {
      const val = document.getElementById("gistInput").value.trim();
      if (val) {
        localStorage.setItem("gexvex_gist_id", val);
        document.getElementById("setupScreen").style.display = "none";
        document.getElementById("appContent").style.display = "block";
        fetchLive();
      }
    }

    function fmtUsd(v) {
      if (v === "" || v === null || v === undefined || isNaN(v)) return "—";
      const n = Number(v);
      const sign = n < 0 ? "-" : "";
      const av = Math.abs(n);
      if (av >= 1e6) return `${sign}$${(av / 1e6).toFixed(1)}M`;
      if (av >= 1e3) return `${sign}$${(av / 1e3).toFixed(1)}K`;
      return `${sign}$${av.toFixed(0)}`;
    }

    function fmtPct(v, hideZero = false) {
      if (v === "" || v === null || v === undefined || v === "—") return "-";
      if (typeof v === "string") return v;
      const num = Number(v);
      if (isNaN(num)) return "-";
      if (hideZero && num === 0) return "-";
      const pct = num * 100;
      const sign = pct > 0 ? "+" : "";
      return `${sign}${pct.toFixed(1)}%`;
    }

    // Viridis scale: big negative = deep purple, ~zero = teal, big positive = lime, king = yellow.
    const VIRIDIS = [[68,1,84],[72,36,117],[65,68,135],[53,95,141],[42,120,142],[33,145,140],[34,168,132],[68,191,112],[122,209,81],[189,223,38],[253,231,37]];
    function viridis(x) {
      x = Math.max(0, Math.min(1, x));
      const f = x * 10, i = Math.min(9, Math.floor(f)), t = f - i, lo = VIRIDIS[i], hi = VIRIDIS[i + 1];
      return lo.map((v, j) => Math.round(v + (hi[j] - v) * t));
    }

    function heatCellStyle(val, minNeg, maxPos, king = false) {
      if (king) return "background-color:#fde725;color:#000000;font-weight:800;";
      const n = Number(val) || 0;
      let x = 0.45;
      if (n < 0 && minNeg < 0) x = 0.45 - 0.45 * Math.pow(Math.min(1, n / minNeg), 0.6);
      else if (n > 0 && maxPos > 0) x = 0.45 + 0.47 * Math.pow(Math.min(1, n / maxPos), 0.6);
      const [r, g, b] = viridis(x);
      const textColor = x > 0.84 ? "#000000" : "#ffffff";
      return `background-color:rgb(${r},${g},${b});color:${textColor};font-weight:${n !== 0 ? 600 : 400};`;
    }

    function fmtUsdShort(v) {
      if (v === "" || v === null || v === undefined || isNaN(v)) return "—";
      const n = Number(v), sign = n < 0 ? "-" : "", av = Math.abs(n);
      if (av >= 1e9) return `${sign}$${(av / 1e9).toFixed(1)}B`;
      if (av >= 1e6) return `${sign}$${(av / 1e6).toFixed(1)}M`;
      if (av >= 1e3) return `${sign}$${(av / 1e3).toFixed(0)}K`;
      return `${sign}$${av.toFixed(0)}`;
    }

    function renderPills() {
      const el = document.getElementById("tickerPills");
      const hide = activeTab === "flow" && flowPreset !== "unusual";
      el.style.display = hide ? "none" : "flex";
      const list = activeTab === "0dte" ? ["TRINITY", ...ZERO_TICKERS]
        : activeTab === "weekly" ? weeklyTickers() : activeTab === "chart" ? CHART_TICKERS : TICKERS;
      const cur = activeTab === "0dte" ? zeroView : activeTab === "weekly" ? weeklyTicker
        : activeTab === "chart" ? chartTicker : activeTicker;
      el.innerHTML = list.map(t =>
        `<button class="pill ${t === cur ? 'active' : ''}" onclick="setTicker('${t}')">${t}</button>`
      ).join("");
    }

    function setTab(tab) {
      activeTab = tab;
      ["0dte", "7dte", "weekly", "flow", "chart"].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle("active", t === tab);
      });
      renderPills();
      renderView();
    }

    function setTicker(t) {
      if (activeTab === "0dte") {
        zeroView = t;
        savePref("gexvex_zero_view", t);
        if (TICKERS.includes(t)) activeTicker = t;
      } else if (activeTab === "weekly") {
        weeklyTicker = t;
        savePref("gexvex_weekly_ticker", t);
      } else if (activeTab === "chart") {
        chartTicker = t;
        savePref("gexvex_chart_ticker", t);
      } else {
        activeTicker = t;
      }
      renderPills();
      renderView();
    }

    function setDeltaTf(tf) {
      deltaTf = tf;
      savePref("gexvex_delta_tf", tf);
      renderView();
    }

    function setTriGreek(g) {
      triGreek = g;
      savePref("gexvex_tri_greek", g);
      renderView();
    }

    // Everything the 0DTE views need for one ticker, or null when it has no rows.
    function zeroData(sym) {
      const d = liveData.zero_dte?.tickers?.[sym];
      if (!d || !Array.isArray(d.rows) || d.rows.length === 0) return null;
      let spotIdx = -1, minDiff = Infinity, minGex = 0, maxGex = 0, minVex = 0, maxVex = 0;
      d.rows.forEach((r, i) => {
        const diff = Math.abs(Number(r.strike) - Number(d.spot));
        if (diff < minDiff) { minDiff = diff; spotIdx = i; }
        const g = Number(r.gex) || 0, v = Number(r.vex) || 0;
        minGex = Math.min(minGex, g); maxGex = Math.max(maxGex, g);
        minVex = Math.min(minVex, v); maxVex = Math.max(maxVex, v);
      });
      const num = v => (v === null || v === undefined || v === "") ? NaN : Number(v);
      const ok = v => Number.isFinite(v) && v > 0;
      const spotNum = Number(d.spot);
      const flip = num(d.flip), em = num(d.exp_move), cw = num(d.call_wall), pw = num(d.put_wall);
      const ghost = num(liveData.magnet_map?.tickers?.[sym]?.magnet);
      // Rows run high to low. A level sits on the top border of the first row below it.
      const edgeIdx = lvl => ok(lvl) ? d.rows.findIndex(r => Number(r.strike) < lvl) : -1;
      const fi = edgeIdx(flip);
      const emIdx = new Set(ok(em) ? [edgeIdx(spotNum + em), edgeIdx(spotNum - em)].filter(i => i > 0) : []);
      // Session sigma bands (anchored at the open) and recent ceiling/floor rolls, from the bot.
      const sig = d.sigma && ok(Number(d.sigma.s1)) ? d.sigma : null;
      const sig1Idx = new Set(sig ? [edgeIdx(Number(sig.hi1)), edgeIdx(Number(sig.lo1))].filter(i => i > 0) : []);
      const sig2Idx = new Set(sig ? [edgeIdx(Number(sig.hi2)), edgeIdx(Number(sig.lo2))].filter(i => i > 0) : []);
      const roll = d.wall_roll || {};
      // Dark pool: top price levels (last sessions) and today's biggest prints, on their nearest strike row.
      const dpT = liveData.darkpool?.tickers?.[sym] || {};
      const dpAll = [...(dpT.levels || []).map(x => ({ ...x, kind: "level" })), ...(dpT.prints || []).map(x => ({ ...x, kind: "print" }))]
        .filter(x => ok(Number(x.price)));
      const strikes = d.rows.map(r => Number(r.strike));
      const step = strikes.length > 1 ? Math.abs(strikes[0] - strikes[1]) : 1;
      const topNodes = [...d.rows].sort((a, b) => Math.abs(Number(b.gex) || 0) - Math.abs(Number(a.gex) || 0)).slice(0, 6).map(r => Number(r.strike));
      const dpRows = new Map();
      dpAll.forEach(x => {
        const px = Number(x.price);
        let bi = -1, bd = Infinity;
        strikes.forEach((k, i) => { const dd = Math.abs(k - px); if (dd < bd) { bd = dd; bi = i; } });
        if (bi < 0 || bd > step) return;  // off the map
        const nearNode = topNodes.some(k => Math.abs(k - px) / px <= 0.001);
        const cur = dpRows.get(bi) || { notional: 0, node: false, items: [] };
        cur.notional += Number(x.notional) || 0; cur.node = cur.node || nearNode; cur.items.push(x);
        dpRows.set(bi, cur);
      });
      return { d, spotIdx, minGex, maxGex, minVex, maxVex, spotNum, flip, em, cw, pw, ghost, ok,
               flipIdx: fi > 0 ? fi : -1, emIdx, sig, sig1Idx, sig2Idx, roll, dpRows, dpLevels: dpT.levels || [], dpTopNodes: topNodes };
    }

    // Small % change badge drawn on a node (Heat-seeker style). Hidden under 1%.
    function deltaBadge(v, short = false) {
      if (v === "" || v === null || v === undefined || typeof v === "string") return "";
      const n = Number(v) * 100;
      if (!Number.isFinite(n) || Math.abs(n) < 1) return "";
      const txt = (short || Math.abs(n) >= 100) ? n.toFixed(0) : n.toFixed(1);
      return `<span class="dbadge ${n > 0 ? 'dup' : 'ddn'}">${n > 0 ? '+' : ''}${txt}%</span>`;
    }

    function nodeCell(val, marker, delta, mn, mx, short) {
      const king = marker === "👑";
      return `<td class="node${king ? ' king-cell' : ''}" style="${heatCellStyle(val, mn, mx, king)}"><div class="nc">${deltaBadge(delta, short)}<span class="nv">${short ? fmtUsdShort(val) : fmtUsd(val)}${king ? (short ? '★' : ' ★') : ''}</span></div></td>`;
    }

    // Heatmap-read study: POP / VANISH badge from the bot's node velocity tracker, plus rug, gatekeeper
    // and stubborn marks on their strike. Visual only.
    function velBadge(z, k, small) {
      const v = z.d.patterns?.velocity?.[String(k)];
      if (!v) return '';
      const pop = v.type === "POP";
      const where = v.where === "WALL" ? 'wall, not a magnet: a ceiling or floor getting stronger next to spot' : v.where === "MAGNET" ? 'magnet across an air pocket' : 'node';
      const title = pop ? `Node popped to ${Math.round(v.share * 100)}% of the map in ${v.minutes} min (${where})` : `Node lost most of its value in ${v.minutes} min: the side it held is gone`;
      const txt = pop ? (small ? '↑' : (v.where === "WALL" ? 'POP·W' : v.where === "MAGNET" ? 'POP·M' : 'POP')) : (small ? '↓' : 'GONE');
      return ` <span class="vel ${pop ? 'pop' : 'vanish'}${v.where === 'WALL' ? ' wall' : ''}" title="${title}">${txt}</span>`;
    }
    function patMarks(z, k, small) {
      const pt = z.d.patterns || {};
      const out = [];
      const rg = pt.rug;
      if (rg && (k === Number(rg.upper) || k === Number(rg.lower))) {
        const rev = rg.type === "REV_RUG";
        out.push(`<span class="pat-mark ${rev ? 'rev' : 'rug'}" title="${rev ? 'Reverse rug' : 'Rug'}: ${rg.upper} over ${rg.lower}, destination ${rg.dest}">${small ? 'R' : (rev ? 'RR' : 'RUG')}</span>`);
      }
      if (pt.path && pt.path.gatekeeper !== null && k === Number(pt.path.gatekeeper)) {
        out.push(`<span class="pat-mark gk" title="Gatekeeper between spot and the king at ${pt.path.king}">GK</span>`);
      }
      if ((pt.stubborn || []).some(n => Number(n.strike) === k)) {
        const n = pt.stubborn.find(n => Number(n.strike) === k);
        out.push(`<span class="pat-mark" title="Stubborn node: ${Math.round(n.share * 100)}% of the map for ${n.hours} h">S</span>`);
      }
      return out.length ? ' ' + out.join(' ') : '';
    }

    function strikeCell(z, r, i, small) {
      const k = Number(r.strike);
      const tags = velBadge(z, k, small) + patMarks(z, k, small) + (z.ok(z.ghost) && k === z.ghost ? ' <span class="ghost-tag" title="All-expiry magnet">♔</span>' : '') +
        (!small && z.ok(z.cw) && k === z.cw ? ` <span class="wall-tag wall-cw">CW</span>${rollArrow(z.roll.ceil, 'Ceiling')}` : '') +
        (!small && z.ok(z.pw) && k === z.pw ? ` <span class="wall-tag wall-pw">PW</span>${rollArrow(z.roll.floor, 'Floor')}` : '') +
        (small && i === z.spotIdx ? '' : dpTag(z.dpRows.get(i), small));  // no room beside the spot arrow
      const label = small ? `${r.strike}` : `$${r.strike}`;
      return `<td class="strike">${i === z.spotIdx ? `<span class="sp">${label}</span>` : label}${tags}</td>`;
    }

    function dpTag(m, small) {
      if (!m) return '';
      const title = m.items.map(x => `${x.kind === 'print' ? "Today's print" : 'Level'} $${Number(x.price).toFixed(2)} · ${fmtUsd(x.notional)}`).join('&#10;')
        + (m.node ? '&#10;Within 0.1% of a top-6 GEX node' : '');
      return ` <span class="dp-tag${m.node ? ' dp-node' : ''}" title="${title}">${small ? 'D' : 'DP'}${m.node ? '+' : ''}</span>`;
    }

    function rowClass(z, i) {
      return `${i === z.spotIdx ? 'spot-row' : ''} ${i === z.flipIdx ? 'flip-edge' : ''} ${z.emIdx.has(i) ? 'em-edge' : ''} ${z.sig2Idx.has(i) ? 'sig2-edge' : z.sig1Idx.has(i) ? 'sig1-edge' : ''}`;
    }

    // Simply0DTE rules from the bot: wall roll arrow, sigma position, EXTREME tag. No alerts.
    function rollArrow(r, name) {
      if (!r) return '';
      const up = r.direction === "up";
      const why = `${name} rolled ${up ? 'up' : 'down'} ${r.from} → ${r.to} at ${r.time_et} ET${r.toward ? ', toward spot' : ''}${r.near ? ' (now within 0.3%)' : ''}`;
      return `<span class="roll ${up ? 'up' : 'down'}" title="${why}">${up ? '⇡' : '⇣'}</span>`;
    }
    // short = just the EXTREME tag (shown first so it is never scrolled off); full = the σ size and position.
    function sigmaTags(z, short) {
      const s = z.sig;
      if (!s) return '';
      const zz = Number(s.z);
      const out = [];
      if (!short) out.push(`<span class="lvl-sig" title="Session bands anchored at $${s.anchor} (${s.at} ET): ±1σ $${s.lo1}–$${s.hi1}, ±2σ $${s.lo2}–$${s.hi2}">σ ±$${Number(s.s1).toFixed(2)}${Number.isFinite(zz) ? ` (${zz >= 0 ? '+' : ''}${zz.toFixed(1)}σ)` : ''}</span>`);
      if (s.tag && short) {
        const low = s.tag.side === "low";
        out.push(`<span class="heat-tag extreme" title="Spot at ${zz.toFixed(1)}σ with a lit +gamma node at $${s.tag.node}: ${low ? 'puts are a no-go here' : 'calls are a no-go here'}">EXTREME ${low ? 'LOW' : 'HIGH'}</span>`);
      }
      return out.join(' ');
    }

    function tfSwitch() {
      return `<span class="seg"><button class="${deltaTf === '10m' ? 'on' : ''}" onclick="setDeltaTf('10m')">10m</button><button class="${deltaTf === '1h' ? 'on' : ''}" onclick="setDeltaTf('1h')">1h</button></span>`;
    }

    const ZERO_LEGEND = `<div class="empty-msg" style="padding:6px 10px;font-size:10px;">★ 0DTE king · ♔ all-expiry magnet · DP = big dark pool level or today's top print (hover for size), <span class="dp-tag dp-node">DP+</span> = also within 0.1% of a top-6 GEX node · <span class="lvl-flip">blue line</span> = 0γ flip · <span class="lvl-em">purple dashes</span> = expected move · grey / <span style="color:#fbbf24;">amber dots</span> = ±1σ / ±2σ session bands from the open · <span class="heat-tag extreme">EXTREME</span> = past 2σ next to a lit +gamma node (don't fade into it) · ⇡/⇣ on CW/PW = ceiling or floor rolled in the last 30 min · badges = % size change over the chosen timeframe (1% or more) · OI = built from open interest at the live price (shown when the Tradytics feed is on a stale price) · ▲/▼ = map bias (king side + which side is gaining GEX) · <span class="heat-tag chop">CHOP</span> = king node oversized, expect pinning · ⇧/⇩ = king reshuffled in the last 30 min · Trinity A/B = SPY and QQQ agree with SPX · <span class="vel pop">POP</span> = node at least doubled and held (·W next to spot = a wall getting stronger, not a magnet; ·M = magnet across an air pocket) · <span class="vel vanish">GONE</span> = a big node lost most of its value · RUG / RR / GK / S on a strike = rug pair, gatekeeper, stubborn node · regime chips: TREND, RANGE, PIN, WHIPSAW, <span class="heat-tag reg-RAINBOW">RAINBOW</span> (stand aside) · PRESS = |GEX| below vs above spot · Trinity ROLL / KING ✓ / BAND / SLING = walls rolling on 2 of 3 maps, SPX reshuffle confirmed, next nodes in SPX points, stubborn node snap-back.</div>`;

    // FlowbyBobby rules from the bot: bias arrow, chop guard, recent king reshuffle.
    function heatTags(h) {
      if (!h) return '';
      const out = [];
      if (h.bias === "bull") out.push('<span class="up" title="Map bias: bull">▲</span>');
      else if (h.bias === "bear") out.push('<span class="down" title="Map bias: bear">▼</span>');
      if (h.chop) {
        const why = h.basis === "history" ? `king in the top ${Math.round(100 - h.pctile * 100)}% for this time of day` : `king holds ${Math.round(h.share * 100)}% of the ladder's GEX`;
        out.push(`<span class="heat-tag chop" title="Chop guard: ${why}">CHOP</span>`);
      }
      if (h.reshuffle) {
        const r = h.reshuffle, up = r.direction === "up";
        out.push(`<span class="${up ? 'up' : 'down'}" title="King reshuffled ${r.from} → ${r.to} at ${r.time_et} ET">${up ? '⇧' : '⇩'}${r.from}→${r.to}</span>`);
      }
      return out.join(' ');
    }
    // Map shape chips from the bot: regime, rug, gatekeeper path to the king, pressure below vs above spot.
    const REGIME_TIPS = {
      RAINBOW: "Rainbow road: nodes alternate sign with no dominant king. Stand aside.",
      PIN: "Positive gamma almost everywhere: pinned. Fade the edges precisely or skip 0DTE.",
      WHIPSAW: "Mostly positive with negative nodes outside both edges: expect moves both ways.",
      RANGE: "Big nodes on both sides of spot: range day, trade the edges, not the middle.",
      TREND: "King and node growth on the same side: trend day, trade with the rolls.",
      MIXED: "No clear shape.",
    };
    function patternTags(pt, short) {
      if (!pt) return '';
      const out = [];
      const reg = pt.regime?.regime;
      if (reg && reg !== "MIXED") out.push(`<span class="heat-tag reg-${reg}" title="${REGIME_TIPS[reg]}">${reg}${reg === 'TREND' && pt.regime.direction ? (pt.regime.direction === 'up' ? ' ▲' : ' ▼') : ''}</span>`);
      if (pt.rug) {
        const rev = pt.rug.type === "REV_RUG";
        out.push(`<span class="heat-tag ${rev ? 'rev' : 'rug'}" title="${rev ? 'Reverse rug (bullish context, not a buy by itself)' : 'Rug: no longs while it holds'}: ${pt.rug.upper} over ${pt.rug.lower}, destination ${pt.rug.dest}">${rev ? 'REV RUG' : 'RUG'}${short ? '' : ' → ' + pt.rug.dest}</span>`);
      }
      if (!short && pt.path) {
        const p = pt.path;
        out.push(`<span title="Path from spot to the king (${p.king}). ${p.air_pocket ? 'Air pocket: little or negative gamma in between, so the move can be fast.' : 'Nodes in between will slow it down.'} ${Math.round(p.neg_share * 100)}% of the path is negative gamma.">${p.gatekeeper !== null ? `GK ${p.gatekeeper} → ` : ''}★${p.king}${p.air_pocket ? ' <span class="heat-tag rev">AIR POCKET</span>' : ''}</span>`);
      }
      if (!short && pt.pressure && pt.pressure.lean !== "even") {
        const pr = pt.pressure, dn = pr.lean === "down", c = pr.change;
        const ratio = dn ? (pr.ratio ?? 0) : (pr.below ? pr.above / pr.below : 0);
        out.push(`<span class="${dn ? 'down' : 'up'}" title="|GEX| in the 8 strikes below spot vs the 8 above${c ? `; last ${c.minutes} min: below ${c.below_pct}%, above ${c.above_pct}%` : ''}">PRESS ${dn ? '▼' : '▲'}${ratio ? ratio.toFixed(1) + 'x' : ''}</span>`);
      }
      return out.join(' ');
    }

    function trinityTag(t) {
      if (!t || !t.maps) return '';
      if (!t.grade) return `<span class="muted" style="font-size:9px;" title="SPX ${t.maps.SPX || '—'} · SPY ${t.maps.SPY || '—'} · QQQ ${t.maps.QQQ || '—'}">TRINITY —</span>`;
      const bear = t.bias === "bear";
      return `<span class="heat-tag grade${t.grade}${bear ? ' bear' : ''}" title="SPX ${t.maps.SPX} · SPY ${t.maps.SPY} · QQQ ${t.maps.QQQ}">TRINITY ${t.grade} ${bear ? '▼' : '▲'}</span>`;
    }

    function renderZeroDte(sym) {
      const z = zeroData(sym);
      if (!z) return `<div class="empty-msg">No 0DTE rows for ${sym} in gexvex_live.json.</div>`;
      const { d } = z;
      const regimeCls = (d.regime || "").startsWith("+") ? "regime-pos" : "regime-neg";
      const lvl = [
        sigmaTags(z, true),
        z.ok(z.flip) ? `<span class="lvl-flip">0γ $${z.flip.toFixed(2)}</span>${d.regime ? ` <span class="${regimeCls}">${d.regime}</span>` : ''}` : '',
        z.ok(z.ghost) ? `<span class="ghost-tag">♔ $${z.ghost}</span>` : '',
        z.ok(z.cw) ? `<span class="up">CW $${z.cw}</span>${rollArrow(z.roll.ceil, 'Ceiling')}` : '',
        z.ok(z.pw) ? `<span class="down">PW $${z.pw}</span>${rollArrow(z.roll.floor, 'Floor')}` : '',
        z.ok(z.em) ? `<span class="lvl-em">EM ±$${z.em.toFixed(2)}</span>` : '',
        sigmaTags(z, false),
        z.dpLevels.length ? `<span style="color:#94a3b8;">DP ${z.dpLevels.slice(0, 3).map(x => {
          const px = Number(x.price), near = z.dpTopNodes.some(k => Math.abs(k - px) / px <= 0.001);
          return `<span title="${fmtUsd(x.notional)} over ${liveData.darkpool?.window || 5} sessions" style="${near ? 'color:#67e8f9;font-weight:700;' : ''}">$${px.toFixed(2)}</span>`;
        }).join(' ')}</span>` : '',
        heatTags(d.heat),
        patternTags(d.patterns, false),
      ].filter(Boolean).join(' · ');
      const g = deltaTf === "10m" ? "g10" : "g1h", v = deltaTf === "10m" ? "v10" : "v1h";
      return `
        <div class="summary-bar">
          <div class="stat"><span>SPOT (${d.label || "0DTE"}${d.source === "chain" ? " · OI" : ""})</span><strong>$${z.spotNum.toFixed(2)}</strong></div>
          <div class="stat"><span>NET GEX</span><strong>${fmtUsd(d.total_gex)}</strong></div>
          <div class="stat"><span>NET VEX</span><strong>${fmtUsd(d.total_vex)}</strong></div>
        </div>
        ${lvl ? `<div class="levels-bar">${lvl}</div>` : ''}
        <div class="hs-controls">% change ${tfSwitch()}</div>
        <table class="hs">
          <thead><tr><th style="width:30%;text-align:left;">Strike</th><th>Net GEX</th><th>Net VEX</th></tr></thead>
          <tbody>
            ${d.rows.map((r, i) => `
              <tr class="${rowClass(z, i)}">
                ${strikeCell(z, r, i, false)}
                ${nodeCell(r.gex, r.gm, r[g], z.minGex, z.maxGex, false)}
                ${nodeCell(r.vex, r.vm, r[v], z.minVex, z.maxVex, false)}
              </tr>`).join("")}
          </tbody>
        </table>
        ${ZERO_LEGEND}`;
    }

    // Trinity: SPY / SPX / QQQ side by side, spot rows lined up.
    function renderTrinity() {
      const isG = triGreek === "gex";
      const key = isG ? "gex" : "vex", mk = isG ? "gm" : "vm";
      const dk = isG ? (deltaTf === "10m" ? "g10" : "g1h") : (deltaTf === "10m" ? "v10" : "v1h");
      const panels = TRINITY.map(sym => ({ sym, z: zeroData(sym) }));
      const maxSpot = Math.max(0, ...panels.map(p => p.z ? p.z.spotIdx : 0));
      const cols = panels.map(({ sym, z }) => {
        if (!z) return `<div class="tri-col"><div class="tri-head"><b>${sym}</b><br><span class="muted">no data yet</span></div></div>`;
        const { d } = z;
        const mn = isG ? z.minGex : z.minVex, mx = isG ? z.maxGex : z.maxVex;
        const king = d.rows.find(r => r[mk] === "👑");
        const kd = king && typeof king[dk] !== "string" ? Number(king[dk]) * 100 : NaN;
        const kChg = Number.isFinite(kd) ? `<span class="${kd >= 0 ? 'up' : 'down'}">${kd >= 0 ? '↑' : '↓'}${Math.abs(kd).toFixed(1)}%</span>` : '';
        const pad = '<tr class="pad"><td class="strike">&nbsp;</td><td></td></tr>'.repeat(Math.max(0, maxSpot - z.spotIdx));
        return `<div class="tri-col">
          <div class="tri-head"><b>${sym}</b>${d.label && d.label !== "0DTE" ? ` <span class="muted">${d.label}</span>` : ''}${d.source === "chain" ? ' <span class="muted" title="Built from open interest: the Tradytics exposure feed is on a stale price">OI</span>' : ''}<br>
            $${z.spotNum.toFixed(2)}<br>
            <span class="kdot"></span>${king ? king.strike : '—'} ${kChg}${d.heat || z.sig?.tag || d.patterns ? `<br>${[heatTags(d.heat), sigmaTags(z, true), patternTags(d.patterns, true)].filter(Boolean).join(' ') || '&nbsp;'}` : ''}</div>
          <table class="hs tri"><tbody>${pad}
            ${d.rows.map((r, i) => `<tr class="${rowClass(z, i)}">${strikeCell(z, r, i, true)}${nodeCell(r[key], r[mk], r[dk], mn, mx, true)}</tr>`).join("")}
          </tbody></table>
        </div>`;
      });
      return `
        <div class="hs-controls">
          <span class="seg"><button class="${isG ? 'on' : ''}" onclick="setTriGreek('gex')">GEX</button><button class="${isG ? '' : 'on'}" onclick="setTriGreek('vex')">VEX</button></span>
          ${tfSwitch()}
          <span style="margin-left:auto;">${trinityExtras(((liveData && liveData.zero_dte) || {}).trinity)} ${trinityTag(((liveData && liveData.zero_dte) || {}).trinity)}</span>
        </div>
        <div class="tri-grid">${cols.join("")}</div>
        ${ZERO_LEGEND}`;
    }

    // Trinity extras from the bot: roll in 2 of 3 maps, SPX reshuffle confirmed, SPX-point stack band, slingshot.
    function trinityExtras(t) {
      if (!t) return '';
      const out = [];

    // ---- FLOW tab: unusual options flow presets (bot: flow) ----
    const FLOW_PRESETS = [

      ["ivx", "IV INFLATION"], ["whales", "WHALES"],
    ];

      big: { minPrem: 500000, maxDte: 400, minAsk: 80, sizeOi: true, otm: true, single: true },
      cluster: { minPrints: 5, minPrem: 500000, minAsk: 80, volOi: true, maxCv: 0.5 },
      accum: { minDays: 3, minAsk: 80 },

      ivx: { min: 1.3, max: 3, side: "all", sym: "ALL" },
    };
    let flowPreset = "big";
    let flowFilters = JSON.parse(JSON.stringify(FLOW_DEFAULTS));
    try {
      const saved = JSON.parse(localStorage.getItem("gexvex_flow_filters_v2") || "null");
      if (saved) Object.keys(FLOW_DEFAULTS).forEach(k => Object.assign(flowFilters[k], saved[k] || {}));
      flowPreset = localStorage.getItem("gexvex_flow_preset") || "big";
    } catch (e) { /* storage blocked: defaults */ }

    function saveFlowPrefs() {
      try {
        localStorage.setItem("gexvex_flow_filters_v2", JSON.stringify(flowFilters));
        localStorage.setItem("gexvex_flow_preset", flowPreset);
      } catch (e) { /* ignore */ }
    }
    function setFlowPreset(p) { flowPreset = p; saveFlowPrefs(); renderPills(); renderView(); }
    function setFlowFilter(group, key, val) {
      const cur = flowFilters[group][key];
      flowFilters[group][key] = typeof cur === "boolean" ? !!val
        : typeof cur === "number" ? (val === "" || isNaN(Number(val)) ? FLOW_DEFAULTS[group][key] : Number(val)) : val;
      saveFlowPrefs();
      renderView();
    }
    function resetFlowFilters(group) {
      flowFilters[group] = JSON.parse(JSON.stringify(FLOW_DEFAULTS[group]));
      saveFlowPrefs();
      renderView();
    }

    function fmtTimeEt(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", hour12: false });
    }
    function fmtNum(v) {
      if (v === null || v === undefined || v === "" || isNaN(v)) return "—";
      const n = Number(v);
      if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1) + "M";
      if (Math.abs(n) >= 1e4) return (n / 1e3).toFixed(1) + "K";
      return n.toLocaleString("en-US");
    }
    function fmtContract(r, withSym = true) {
      const t = r.type === "call" ? "C" : "P";
      const exp = (r.expiry || "").slice(5).replace("-", "/");
      return `${withSym && r.symbol ? `<strong>${r.symbol}</strong> ` : ""}<span class="${t === 'C' ? 'badge-call' : 'badge-put'}">${Number(r.strike)}${t}</span> <span style="color:#94a3b8;">${exp}</span>`;
    }
    function fmtAsk(v) {
      if (v === null || v === undefined) return "—";
      const n = Number(v);
      const cls = n >= 80 ? "up" : n <= 30 ? "down" : "";
      return `<span class="${cls}">${Math.round(n)}%</span>`;
    }
    function fmtIvx(v) {
      if (v === null || v === undefined) return "—";
      const n = Number(v);
      const cls = n >= 1.3 ? "up" : n <= 0.8 ? "down" : "";
      return `<span class="${cls}">${n.toFixed(2)}x</span>`;
    }
    function flowInput(group, key, label, step = "any", width = 70) {
      return `<label class="flow-field"><span>${label}</span><input type="number" inputmode="decimal" step="${step}" value="${flowFilters[group][key]}" style="width:${width}px;" onchange="setFlowFilter('${group}','${key}',this.value)"></label>`;
    }
    function flowToggle(group, key, label) {
      const on = flowFilters[group][key];
      return `<button class="flow-chip ${on ? 'on' : ''}" onclick="setFlowFilter('${group}','${key}',${!on})">${on ? '✓ ' : ''}${label}</button>`;
    }
    function flowNote(text) { return `<div class="empty-msg" style="padding:6px 10px;font-size:10px;">${text}</div>`; }

    function passesBig(r, f) {
      if (Number(r.premium) < f.minPrem) return false;
      if (f.maxDte > 0 && (r.dte === null || r.dte === undefined || r.dte > f.maxDte)) return false;
      if (f.otm && !r.otm) return false;
      if (f.single && !r.single_leg) return false;
      if (f.sizeOi && !(r.open_interest !== null && r.open_interest !== undefined
        && (r.size > r.open_interest || (r.volume !== null && r.volume !== undefined && r.volume > r.open_interest)))) return false;
      if (f.minAsk > 0 && (r.ask_pct === null || r.ask_pct === undefined || r.ask_pct < f.minAsk)) return false;
      return true;
    }

          <tbody>${rows.map(r => `<tr>

    function passesCluster(r, f) {

      if (f.maxCv > 0 && (r.size_cv === null || r.size_cv === undefined || r.size_cv > f.maxCv)) return false;
      return true;
    }

          <tbody>${rows.map(r => `<tr>

    function renderFlowWhales(fl) {

      const stCls = st => st === "still in" ? "st-still" : st === "trimming" ? "st-trim" : st === "exited" ? "st-exit" : "st-muted";

          <thead><tr><th style="text-align:left;">Contract</th><th>Flagged</th><th>Source</th><th>Entry</th><th>Now</th><th>P&L</th><th>Best</th><th>OI base → peak → now</th><th>Status</th></tr></thead>
          <tbody>${rows.map(w => `<tr>
              <td style="text-align:left;">${fmtContract(w)}</td>
              <td>${(w.flagged || '').slice(5).replace('-', '/')}</td>
              <td class="muted">${w.source || ''}</td>
              <td>${w.entry_price ?? '—'}</td>
              <td>${w.mid ?? '—'}</td>
              <td><strong>${pnl(w.pnl_pct)}</strong></td>
              <td>${pnl(w.max_pnl_pct)}</td>
              <td>${fmtNum(w.base_oi)} → ${fmtNum(w.peak_oi)} → ${fmtNum(w.oi)}</td>
              <td class="${stCls(w.status)}">${w.status}</td>

        + flowNote("P&L = contract mid vs the whale's average fill. Status from open interest: still in (80%+ of the OI they added remains), trimming (40–80%), exited (under 40%), no OI add (OI never rose: likely a closing or day trade). OI updates overnight, so new rows wait a session. Discord alerts on trimming and exited. Full log in the Whale Log sheet tab.");
    }

    function renderFlow() {
      const fl = liveData.flow || {};
      const tabs = `<div class="flow-presets">${FLOW_PRESETS.map(([k, label]) =>
        `<button class="mode-btn ${flowPreset === k ? 'active' : ''}" onclick="setFlowPreset('${k}')">${label}</button>`).join("")}</div>`;
      if (!liveData.flow) {
        return tabs + `<div class="empty-msg">No flow data in gexvex_live.json yet. It appears once the updated bot runs during market hours.</div>`;
      }
      const body = flowPreset === "unusual" ? renderFlowUnusual(fl)
        : flowPreset === "cluster" ? renderFlowCluster(fl)

    // ---------- CHART tab ----------
    // Candles + GEX levels for one ticker. Price and levels come from the snapshots this
    // phone has seen today (one every 30s while the app is open), kept in localStorage per
    // trading day. Lines: GEX king and flip over time (step lines), plus the current call
    // wall, put wall, all-expiry magnet and expected move as horizontal lines.
    const CHART_TICKERS = ["SPY", "SPX", "QQQ", "SMH", "TSLA", "AAPL", "NVDA"];
    const CHART_LIB = "https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js";
    const CHART_KEEP_DAYS = 3;
    let chartTicker = pref("gexvex_chart_ticker", "SPY");
    let chartTf = Number(pref("gexvex_chart_tf", "300"));
    let chartLibPromise = null;
    let chartObj = null;  // { key, chart, candles, king, flip, lines: [] }
    const etDay = ts => new Date(ts * 1000).toLocaleDateString("en-CA", { timeZone: "America/New_York" });
    const etTime = ts => new Date(ts * 1000).toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", hour12: false });

    function chartKing(rows) {
      let best = null;
      (rows || []).forEach(r => {
        const g = Number(r.gex);
        if (Number.isFinite(g) && (!best || Math.abs(g) > Math.abs(best.g))) best = { k: Number(r.strike), g };
      });
      return best ? best.k : null;
    }

    function loadSamples(day) {
      try { return JSON.parse(localStorage.getItem(`gexvex_chart_${day}`) || "{}"); } catch (e) { return {}; }
    }

    // Called after every successful fetch: one sample per ticker per new bot snapshot.
    function recordChartSample() {
      const ts = Number(liveData?.server_ts);
      const tick = liveData?.zero_dte?.tickers;
      if (!(ts > 0) || !tick) return;
      const day = etDay(ts);
      const store = loadSamples(day);
      let added = false;
      Object.entries(tick).forEach(([sym, d]) => {
        const p = Number(d?.spot);
        if (!(p > 0)) return;
        const arr = store[sym] || (store[sym] = []);
        if (arr.length && arr[arr.length - 1].t >= ts) return;
        const n = v => { const x = Number(v); return Number.isFinite(x) && x > 0 ? x : null; };
        arr.push({ t: ts, p, k: chartKing(d.rows), f: n(d.flip) });
        if (arr.length > 1600) arr.splice(0, arr.length - 1600);
        added = true;
      });
      if (!added) return;
      try {
        localStorage.setItem(`gexvex_chart_${day}`, JSON.stringify(store));
        Object.keys(localStorage).filter(k => k.startsWith("gexvex_chart_2")).sort().reverse()
          .slice(CHART_KEEP_DAYS).forEach(k => localStorage.removeItem(k));
      } catch (e) { console.warn("Chart samples not saved:", e); }
    }

    function chartSeries(sym) {
      const ts = Number(liveData?.server_ts) || Date.now() / 1000;
      const samples = (loadSamples(etDay(ts))[sym] || []).slice().sort((a, b) => a.t - b.t);
      const bars = [], king = [], flip = [];
      samples.forEach(s => {
        const b = s.t - (s.t % chartTf);
        const last = bars[bars.length - 1];
        if (last && last.time === b) {
          last.high = Math.max(last.high, s.p); last.low = Math.min(last.low, s.p); last.close = s.p;
        } else {
          bars.push({ time: b, open: s.p, high: s.p, low: s.p, close: s.p });
        }
        const put = (arr, v) => {
          if (v === null || v === undefined) return;
          if (arr.length && arr[arr.length - 1].time === b) arr[arr.length - 1].value = v; else arr.push({ time: b, value: v });
        };
        put(king, s.k); put(flip, s.f);
      });
      return { bars, king, flip, n: samples.length };
    }

    function chartLevels(sym) {
      const d = liveData?.zero_dte?.tickers?.[sym] || {};
      const n = v => { const x = Number(v); return Number.isFinite(x) && x > 0 ? x : null; };
      const spot = n(d.spot), em = n(d.exp_move);
      return {
        spot, king: chartKing(d.rows), flip: n(d.flip), cw: n(d.call_wall), pw: n(d.put_wall),
        magnet: n(liveData?.magnet_map?.tickers?.[sym]?.magnet), em,
        emHi: spot && em ? spot + em : null, emLo: spot && em ? spot - em : null, regime: d.regime || "",
      };
    }

    const CHART_COLORS = { king: "#facc15", flip: "#e5e7eb", cw: "#4ade80", pw: "#f87171", magnet: "#c084fc", em: "#64748b" };

    function setChartTf(tf) {
      chartTf = tf; savePref("gexvex_chart_tf", String(tf));
      chartObj = null; renderView();
    }

    function renderChartShell(sym) {
      const L = chartLevels(sym);
      const f = v => v === null || v === undefined ? "—" : Number(v).toFixed(2);
      const item = (c, label, v) => `<span><b style="color:${c}">${label}</b> ${v}</span>`;
      return `
        <div class="chart-tf">
          ${[[60, "1m"], [300, "5m"], [900, "15m"]].map(([tf, l]) =>
            `<button class="flow-chip ${chartTf === tf ? "on" : ""}" onclick="setChartTf(${tf})">${l}</button>`).join("")}
          <span class="chart-note" id="chartNote"></span>
        </div>
        <div class="chart-legend" id="chartLegend">
          ${item("#fff", sym, f(L.spot))}
          ${item(CHART_COLORS.king, "KING", f(L.king))}
          ${item(CHART_COLORS.flip, "FLIP", f(L.flip))}
          ${item(CHART_COLORS.cw, "CW", f(L.cw))}
          ${item(CHART_COLORS.pw, "PW", f(L.pw))}
          ${item(CHART_COLORS.magnet, "MAGNET", f(L.magnet))}
          ${item(CHART_COLORS.em, "EM ±", f(L.em))}
          ${L.regime ? `<span class="${L.regime.includes("−") ? "regime-neg" : ""}">${L.regime}</span>` : ""}
        </div>
        <div id="chartBox"></div>`;
    }

    function loadChartLib() {
      if (window.LightweightCharts) return Promise.resolve();
      if (!chartLibPromise) {
        chartLibPromise = new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = CHART_LIB; s.onload = resolve;
          s.onerror = () => { chartLibPromise = null; reject(new Error("chart library failed to load")); };
          document.head.appendChild(s);
        });
      }
      return chartLibPromise;
    }

    async function drawChart() {
      const sym = chartTicker;
      const box = document.getElementById("chartBox");
      if (!box) return;
      try { await loadChartLib(); } catch (e) { box.innerHTML = `<div class="empty-msg">${e.message}. Check your connection.</div>`; return; }
      if (activeTab !== "chart" || sym !== chartTicker || !document.getElementById("chartBox")) return;
      const LC = window.LightweightCharts;
      const key = `${sym}|${chartTf}`;
      if (!chartObj || chartObj.key !== key || !box.contains(chartObj.el)) {
        if (chartObj) { try { chartObj.chart.remove(); } catch (e) {} }
        box.innerHTML = "";
        const chart = LC.createChart(box, {
          autoSize: true,
          layout: { background: { color: "#000000" }, textColor: "#94a3b8", fontFamily: "Roboto Mono, monospace", fontSize: 10 },
          grid: { vertLines: { color: "#0f172a" }, horzLines: { color: "#0f172a" } },
          rightPriceScale: { borderColor: "#1d283b" },
          timeScale: { borderColor: "#1d283b", timeVisible: true, secondsVisible: false, rightOffset: 4,
                       tickMarkFormatter: t => etTime(t) },
          localization: { timeFormatter: t => etTime(t) },
          crosshair: { mode: LC.CrosshairMode.Normal },
        });
        const candles = chart.addCandlestickSeries({
          upColor: "#22c55e", downColor: "#ef4444", borderVisible: false, wickUpColor: "#22c55e", wickDownColor: "#ef4444",
          // Stretch the price axis so the walls and magnet stay on screen.
          autoscaleInfoProvider: base => {
            const r = base(), extra = chartObj?.keepVisible || [];
            if (!r || !r.priceRange || !extra.length) return r;
            r.priceRange.minValue = Math.min(r.priceRange.minValue, ...extra);
            r.priceRange.maxValue = Math.max(r.priceRange.maxValue, ...extra);
            return r;
          },
        });
        const step = LC.LineType.WithSteps;
        const king = chart.addLineSeries({ color: CHART_COLORS.king, lineWidth: 2, lineType: step, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
        const flip = chart.addLineSeries({ color: CHART_COLORS.flip, lineWidth: 1, lineStyle: LC.LineStyle.Dashed, lineType: step, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
        chartObj = { key, chart, candles, king, flip, lines: [], el: box.firstChild, fitted: false };
      }
      const S = chartSeries(sym);
      const L = chartLevels(sym);
      chartObj.keepVisible = [L.cw, L.pw, L.magnet].filter(v => v);
      chartObj.candles.setData(S.bars);
      chartObj.king.setData(S.king);
      chartObj.flip.setData(S.flip);
      chartObj.lines.forEach(l => chartObj.candles.removePriceLine(l));
      const solid = LC.LineStyle.Solid, dotted = LC.LineStyle.Dotted;
      chartObj.lines = [
        [L.cw, CHART_COLORS.cw, "CW", solid], [L.pw, CHART_COLORS.pw, "PW", solid],
        [L.magnet, CHART_COLORS.magnet, "MAG", LC.LineStyle.LargeDashed],
        [L.emHi, CHART_COLORS.em, "EM+", dotted], [L.emLo, CHART_COLORS.em, "EM−", dotted],
        [L.king, CHART_COLORS.king, "KING", dotted],
      ].filter(([p]) => p).map(([price, color, title, lineStyle]) =>
        chartObj.candles.createPriceLine({ price, color, title, lineStyle, lineWidth: 1, axisLabelVisible: true }));
      if (!chartObj.fitted && S.bars.length) { chartObj.chart.timeScale().fitContent(); chartObj.fitted = true; }
      const note = document.getElementById("chartNote");
      if (note) note.textContent = S.n ? `${S.n} samples today · ${etTime(S.bars[0].time)}–${etTime(S.bars[S.bars.length - 1].time)} ET`
        : "no samples yet today";
      if (!S.bars.length && !box.querySelector(".chart-empty")) {
        const msg = document.createElement("div");
        msg.className = "empty-msg chart-empty";
        msg.style.cssText = "position:absolute;top:120px;left:0;right:0;text-align:center;border:none;pointer-events:none;";
        msg.textContent = "Candles build up while the app is open during market hours (one sample per bot update, every 30s).";
        box.style.position = "relative"; box.appendChild(msg);
      } else if (S.bars.length) {
        box.querySelector(".chart-empty")?.remove();
      }
    }

    function renderView() {
      const box = document.getElementById("viewContainer");
      if (!liveData) {
        box.innerHTML = `<div class="empty-msg">${lastError ? "Fetch error: " + lastError : "Waiting for data..."}</div>`;
        return;
      }

      if (activeTab !== "chart" && chartObj) { try { chartObj.chart.remove(); } catch (e) {} chartObj = null; }
      if (activeTab === "chart") {
        // Keep the chart (and your zoom) across refreshes; only rebuild on ticker/timeframe change.
        if (!(chartObj && chartObj.key === `${chartTicker}|${chartTf}` && document.getElementById("chartBox"))) {
          if (chartObj) { try { chartObj.chart.remove(); } catch (e) {} chartObj = null; }
          box.innerHTML = renderChartShell(chartTicker);
        } else {
          const legend = document.getElementById("chartLegend");
          const fresh = document.createElement("div");
          fresh.innerHTML = renderChartShell(chartTicker);
          legend.innerHTML = fresh.querySelector("#chartLegend").innerHTML;
        }
        drawChart();
      } else if (activeTab === "0dte") {
        box.innerHTML = zeroView === "TRINITY" ? renderTrinity() : renderZeroDte(zeroView);
      } else if (activeTab === "7dte") {
        box.innerHTML = renderSetups() + renderMagnetMap() + renderNodeGrowth() + renderScanner7dte();
      } else if (activeTab === "flow") {
        box.innerHTML = renderFlow();
      } else {
        const w = weeklyData(weeklyTicker) || {};
        const exps = Array.isArray(w.expiries) ? w.expiries : [];
        const strikes = Array.isArray(w.strikes) ? w.strikes : [];
        const matrix = weeklyMode === "vex" ? w.vex : w.gex;

        const toggleHeader = `
          <div class="mode-switch">
            <button class="mode-btn ${weeklyMode === 'gex' ? 'active' : ''}" onclick="setWeeklyMode('gex')">WEEKLY OPEX GEX</button>
            <button class="mode-btn ${weeklyMode === 'vex' ? 'active' : ''}" onclick="setWeeklyMode('vex')">WEEKLY OPEX VEX</button>
          </div>`;

        if (strikes.length === 0 || exps.length === 0 || !Array.isArray(matrix)) {
          const why = weeklyTicker === "VIX" ? "Tradytics sends no greeks for VIX, so this stays empty."
            : !(liveData.weekly || {}).by_symbol && weeklyTicker !== "SPY"
              ? `${weeklyTicker} appears after the updated bot's next weekly run (every 5 min in market hours).`
              : `The weekly ${weeklyMode.toUpperCase()} matrix for ${weeklyTicker} is empty in gexvex_live.json.`;
          box.innerHTML = `${toggleHeader}<div class="empty-msg">${why}</div>`;
          return;
        }

        let minVal = 0, maxVal = 0;
        matrix.forEach(row => {
          if (!Array.isArray(row)) return;
          row.forEach(cell => {
            const v = Number(cell?.v) || 0;
            if (v < minVal) minVal = v;
            if (v > maxVal) maxVal = v;
          });
        });

        let spotIdx = -1, minDiff = Infinity;
        strikes.forEach((k, idx) => {
          const diff = Math.abs(Number(k) - Number(w.spot));
          if (diff < minDiff) { minDiff = diff; spotIdx = idx; }
        });

        box.innerHTML = `
          ${toggleHeader}
          <div class="summary-bar">
            <div class="stat"><span>${weeklyTicker} SPOT</span><strong>$${Number(w.spot || 0).toFixed(2)}</strong></div>
            <div class="stat"><span>EXPIRIES</span><strong>${exps.length}</strong></div>
            <div class="stat"><span>MODE</span><strong>${weeklyMode.toUpperCase()} MATRIX</strong></div>
          </div>
          <div class="matrix-scroll">
            <table class="matrix-table">
              <thead>
                <tr>
                  <th>Strike</th>
                  ${exps.map(e => `<th>${String(e).slice(5)}</th>`).join("")}
                </tr>
              </thead>
              <tbody>
                ${strikes.map((k, rIdx) => {
                  const isSpot = rIdx === spotIdx;
                  return `<tr class="${isSpot ? 'spot-row' : ''}">
                    <td>$${k}</td>
                    ${exps.map((_, cIdx) => {
                      const cell = matrix?.[rIdx]?.[cIdx] || { v: 0, b: "" };
                      const styleAttr = isSpot ? "" : heatCellStyle(cell.v, minVal, maxVal);
                      return `<td style="${styleAttr}" class="${cell.b === '👑' ? 'king-cell' : ''}">${cell.b ? cell.b + ' ' : ''}${fmtUsd(cell.v)}</td>`;
                    }).join("")}
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>`;
      }
    }

    // The GitHub REST API allows only 60 unauthenticated requests/hour per IP,
    // and polling every 30s needs 120. So the API is called once to learn the
    // Gist owner, then polling goes to the raw file URL, which has no such limit.
    const GIST_FILE = "gexvex_live.json";

    async function getGistOwner(gistId) {
      const key = `gexvex_gist_owner_${gistId}`;
      const cached = localStorage.getItem(key);
      if (cached) return cached;
      const res = await fetch(`https://api.github.com/gists/${gistId}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status} looking up Gist`);
      const owner = (await res.json()).owner?.login;
      if (!owner) throw new Error("Could not find the Gist owner");
      localStorage.setItem(key, owner);
      return owner;
    }

    async function fetchGistFile(gistId) {
      const owner = await getGistOwner(gistId);
      // The query string busts GitHub's ~5 minute CDN cache on raw files.
      const url = `https://gist.githubusercontent.com/${owner}/${gistId}/raw/${GIST_FILE}?t=${Date.now()}`;
      const res = await fetch(url, { cache: "no-store" });
      if (res.status === 404) {
        localStorage.removeItem(`gexvex_gist_owner_${gistId}`);
        throw new Error(`${GIST_FILE} missing in Gist`);
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.text();
    }

    async function fetchLive() {
      const gistId = getGistId();
      if (!gistId) {
        document.getElementById("setupScreen").style.display = "block";
        document.getElementById("appContent").style.display = "none";
        return;
      }
      try {
        liveData = JSON.parse(await fetchGistFile(gistId));
        lastError = "";
        recordChartSample();
        renderView();
      } catch (e) {
        lastError = e.message || String(e);
        console.error(e);
        renderView();
      }
      countdown = 30;
      renderStatus();
    }

    setInterval(() => {
      countdown--;
      if (countdown <= 0) fetchLive();
      renderStatus();
    }, 1000);

    renderPills();
    fetchLive();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((e) => console.warn("Service worker not registered:", e));
      });
    }
  </script>
</body>
</html>
