<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0e13" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="GexVex" />
  <title>GexVex Live</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --panel: #0a0e13;
      --border: #1d283b;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --purple: #7e22ce;
      --slate: #234f6e;
      --yellow: #facc15;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto Mono', monospace; }
    body { background: var(--bg); color: var(--text); padding-bottom: 70px; -webkit-font-smoothing: antialiased; }
    header {
      position: sticky; top: 0; z-index: 30; background: var(--panel);
      border-bottom: 1px solid var(--border); padding: 10px 12px; height: 42px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .title { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; color: #fff; }
    .stamp { font-size: 11px; color: var(--yellow); text-align: right; }
    .stamp.stale { color: #f87171; font-weight: 700; }
    .stale-banner {
      display: none; padding: 8px 12px; background: #450a0a; color: #fecaca;
      border-bottom: 1px solid #7f1d1d; font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
    }
    .stale-banner.show { display: block; }
    .pills {
      display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px;
      background: #05070a; border-bottom: 1px solid var(--border);
    }
    .pill {
      padding: 6px 11px; border: 1px solid var(--border); background: var(--panel);
      color: var(--muted); font-size: 12px; font-weight: 700; border-radius: 4px; cursor: pointer;
    }
    .pill.active { background: #fff; color: #000; border-color: #fff; }
    .mode-switch {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      padding: 8px 10px; background: #05070a; border-bottom: 1px solid var(--border);
    }
    .mode-btn {
      padding: 9px 10px; border: 1px solid var(--border); background: var(--panel);
      color: var(--muted); font-size: 12px; font-weight: 700; border-radius: 4px;
      cursor: pointer; letter-spacing: 0.4px;
    }
    .mode-btn.active {
      background: var(--yellow); color: #000000; border-color: var(--yellow);
    }
    .summary-bar {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      padding: 10px 10px 8px; background: var(--panel); border-bottom: 1px solid var(--border);
      font-size: 11px;
    }
    .stat span { display: block; color: var(--muted); font-size: 10px; margin-bottom: 2px; }
    .stat strong { font-size: 13px; }
    .matrix-scroll { overflow-x: auto; width: 100%; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th {
      background: var(--panel); color: var(--muted); font-weight: 600;
      padding: 7px 6px; border-bottom: 1px solid var(--border); border-right: 1px solid #131c2b;
      text-align: right; position: sticky; top: 42px; z-index: 15; white-space: nowrap;
    }
    th:first-child, td:first-child { text-align: left; padding-left: 10px; }
    .matrix-table th {
      position: sticky; top: 42px; z-index: 18; background: var(--panel);
    }
    .matrix-table th:first-child,
    .matrix-table td:first-child {
      position: sticky; left: 0; background: var(--panel);
      border-right: 1px solid var(--border);
    }
    .matrix-table td:first-child { z-index: 16; }
    .matrix-table th:first-child { top: 42px; z-index: 24; }
    td {
      padding: 7px 6px; border-bottom: 1px solid #111827; border-right: 1px solid #0f172a;
      text-align: right; white-space: nowrap;
    }
    tr.spot-row td { background: #ffffff !important; color: #000000 !important; font-weight: 700; }
    .king-cell { font-size: 12px; font-weight: 700; }
    .badge-call { background: rgba(34, 197, 94, 0.2); color: #4ade80; padding: 2px 5px; border-radius: 3px; font-weight: 700; }
    .badge-put { background: rgba(244, 63, 94, 0.2); color: #fb7185; padding: 2px 5px; border-radius: 3px; font-weight: 700; }
    .magnet-flag { color: var(--yellow); font-weight: 700; }
    .section-head {
      padding: 8px 10px; background: #0a0e13; border-top: 1px solid #1d283b; border-bottom: 1px solid #1d283b;
      font-size: 11px; font-weight: 700; color: #facc15; margin-top: 8px;
      display: flex; justify-content: space-between; gap: 8px;
    }
    .section-head:first-child { margin-top: 0; border-top: none; }
    .section-head .sub { color: var(--muted); font-weight: 400; }
    .str-strong { color: #4ade80; font-weight: 700; }
    .str-moderate { color: #facc15; font-weight: 700; }
    .str-weak { color: #94a3b8; font-weight: 700; }
    .up { color: #4ade80; }
    .down { color: #fb7185; }
    tr.active-row td { background: #111827; }
    tr.magnet-row td { background: #1c1606; }
    .chg { font-size: 9px; font-weight: 400; opacity: 0.85; margin-top: 1px; }
    tr.flip-row td { background: #0b1220; color: #38bdf8; font-size: 10px; font-weight: 700; text-align: center; letter-spacing: 0.5px; padding: 3px 4px; border-top: 2px dashed #38bdf8; border-bottom: 2px dashed #38bdf8; }
    tr.ghost-row td { background: #111827; color: #f8fafc; font-style: italic; }
    .ghost-tag { color: #ffffff; font-weight: 700; text-shadow: 0 0 6px rgba(255,255,255,0.7); }
    .regime-pos { color: #4ade80; }
    tr.em-row td { background: #0b0f17; color: #a78bfa; font-size: 10px; font-weight: 700; text-align: center; padding: 2px 4px; border-top: 1px dotted #a78bfa; border-bottom: 1px dotted #a78bfa; }
    .wall-tag { display: inline-block; font-size: 9px; font-weight: 700; padding: 0 3px; border-radius: 3px; margin-left: 2px; }
    .wall-cw { background: #14532d; color: #86efac; }
    .wall-pw { background: #7f1d1d; color: #fecaca; }
    .regime-neg { color: #fb7185; }
    .matrix-scroll table:not(.matrix-table) th { position: static; }
    .signal-cell { text-align: left; font-size: 10px; white-space: normal; min-width: 120px; }
    .empty-msg { padding: 18px 12px; color: var(--muted); font-size: 11px; border-bottom: 1px solid #111827; }
    nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
      background: var(--panel); border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(4, 1fr); z-index: 30;
    }
    nav button {
      background: none; border: none; color: var(--muted); font-size: 11px;
      font-weight: 700; cursor: pointer; border-right: 1px solid var(--border);
    }
    nav button.active { color: var(--yellow); background: #111827; }
    .flow-presets {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
      padding: 8px 10px; background: #05070a; border-bottom: 1px solid var(--border);
    }
    .flow-presets .mode-btn { padding: 8px 4px; font-size: 10px; }
    .flow-controls {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end;
      padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--border);
    }
    .flow-field { display: flex; flex-direction: column; gap: 2px; font-size: 9px; color: var(--muted); }
    .flow-field input {
      background: #05070a; border: 1px solid var(--border); color: #fff; font-size: 12px;
      padding: 5px 6px; border-radius: 4px;
    }
    .flow-chip {
      padding: 6px 8px; border: 1px solid var(--border); background: #05070a; color: var(--muted);
      font-size: 10px; font-weight: 700; border-radius: 4px; cursor: pointer;
    }
    .flow-chip.on { background: var(--yellow); color: #000; border-color: var(--yellow); }
    .setup-box { padding: 20px; text-align: center; }
    .setup-box input {
      width: 100%; padding: 10px; margin: 10px 0; background: var(--panel);
      border: 1px solid var(--border); color: #fff; font-size: 12px;
    }
    .setup-box button { padding: 10px 16px; background: var(--yellow); color: #000; border: none; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <div class="title">GEX/VEX LIVE <span style="color:#94a3b8;font-size:10px;">v2.7</span></div>
    <div class="stamp" id="statusStamp">CONNECTING...</div>
  </header>

  <div id="setupScreen" class="setup-box" style="display:none;">
    <p style="font-size:12px;color:#94a3b8;">Paste your Secret Gist ID once (saved locally on your phone):</p>
    <input id="gistInput" placeholder="e.g. f9f6506d780efb0df175de3cc42d60e1" />
    <button onclick="saveGistId()">SAVE & CONNECT</button>
  </div>

  <div id="appContent">
    <div class="stale-banner" id="staleBanner"></div>
    <div class="pills" id="tickerPills"></div>
    <div id="viewContainer"></div>
  </div>

  <nav>
    <button id="tab-0dte" class="active" onclick="setTab('0dte')">0DTE MAP</button>
    <button id="tab-7dte" onclick="setTab('7dte')">SCANNERS</button>
    <button id="tab-weekly" onclick="setTab('weekly')">WEEKLY OPEX</button>
    <button id="tab-flow" onclick="setTab('flow')">FLOW</button>
  </nav>

  <script>
    const TICKERS = ["SPY", "QQQ", "SMH", "VIX", "TSLA", "AAPL", "NVDA"];
    let activeTab = "0dte";
    let activeTicker = "SPY";
    let weeklyMode = "gex";
    let liveData = null;
    let lastError = "";
    let countdown = 30;
    // The bot writes server_ts (epoch seconds) into every Gist snapshot.
    // Treat data older than this as stale and replace the LIVE label.
    const STALE_AFTER_SEC = 120;

    function fmtAge(sec) {
      if (sec < 60) return `${sec}s`;
      const m = Math.floor(sec / 60);
      if (m < 60) return `${m}m`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h ${m % 60}m`;
      const d = Math.floor(h / 24);
      return `${d}d ${h % 24}h`;
    }

    function renderStatus() {
      const stampEl = document.getElementById("statusStamp");
      const bannerEl = document.getElementById("staleBanner");
      const ts = Number(liveData?.server_ts);
      let label, stale = false, banner = "";

      if (ts > 0) {
        const age = Math.max(0, Math.floor(Date.now() / 1000 - ts));
        if (age > STALE_AFTER_SEC) {
          stale = true;
          label = `STALE • ${fmtAge(age)} OLD`;
          const when = new Date(ts * 1000).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
          banner = `⚠ DATA IS ${fmtAge(age).toUpperCase()} OLD (last update ${when}). `
            + (lastError ? `Fetch error: ${lastError}.` : "Bot may be stopped or market closed.");
        } else {
          label = `${lastError ? "ERR" : "LIVE"} ${liveData?.zero_dte?.updated_at || ""}`.trim();
        }
      } else if (liveData) {
        // Older snapshot without server_ts: age unknown, keep the bot's own stamp.
        label = liveData.zero_dte?.updated_at || "AGE UNKNOWN";
      } else {
        label = lastError ? "ERR" : "CONNECTING...";
      }
      if (lastError && liveData && !(ts > 0)) label = `ERR • ${label}`;

      stampEl.textContent = `${label} • ${countdown}s`;
      stampEl.classList.toggle("stale", stale);
      bannerEl.textContent = banner;
      bannerEl.classList.toggle("show", stale);
    }

    function getGistId() {
      const p = new URLSearchParams(window.location.search).get("gist");
      if (p) { localStorage.setItem("gexvex_gist_id", p.trim()); return p.trim(); }
      return (localStorage.getItem("gexvex_gist_id") || "").trim();
    }

    function saveGistId() {
      const val = document.getElementById("gistInput").value.trim();
      if (val) {
        localStorage.setItem("gexvex_gist_id", val);
        document.getElementById("setupScreen").style.display = "none";
        document.getElementById("appContent").style.display = "block";
        fetchLive();
      }
    }

    function fmtUsd(v) {
      if (v === "" || v === null || v === undefined || isNaN(v)) return "—";
      const n = Number(v);
      const sign = n < 0 ? "-" : "";
      const av = Math.abs(n);
      if (av >= 1e6) return `${sign}$${(av / 1e6).toFixed(1)}M`;
      if (av >= 1e3) return `${sign}$${(av / 1e3).toFixed(1)}K`;
      return `${sign}$${av.toFixed(0)}`;
    }

    function fmtPct(v, hideZero = false) {
      if (v === "" || v === null || v === undefined || v === "—") return "-";
      if (typeof v === "string") return v;
      const num = Number(v);
      if (isNaN(num)) return "-";
      if (hideZero && num === 0) return "-";
      const pct = num * 100;
      const sign = pct > 0 ? "+" : "";
      return `${sign}${pct.toFixed(1)}%`;
    }

    function heatCellStyle(val, minNeg, maxPos) {
      const n = Number(val) || 0;
      let r = 35, g = 79, b = 110;
      let textColor = "#e5e7eb";

      if (n < 0 && minNeg < 0) {
        const t = Math.min(1, Math.abs(n) / Math.abs(minNeg));
        r = Math.round(35 + (126 - 35) * t);
        g = Math.round(79 + (34 - 79) * t);
        b = Math.round(110 + (206 - 110) * t);
        textColor = t > 0.45 ? "#f3e8ff" : "#e5e7eb";
      } else if (n > 0 && maxPos > 0) {
        const t = Math.min(1, n / maxPos);
        r = Math.round(35 + (250 - 35) * t);
        g = Math.round(79 + (204 - 79) * t);
        b = Math.round(110 + (21 - 110) * t);
        textColor = t > 0.58 ? "#000000" : "#fef08a";
      }
      return `background-color:rgb(${r},${g},${b});color:${textColor};font-weight:${n !== 0 ? 600 : 400};`;
    }

    function renderPills() {
      const el = document.getElementById("tickerPills");
      const hide = activeTab === "weekly" || (activeTab === "flow" && flowPreset !== "unusual");
      el.style.display = hide ? "none" : "flex";
      el.innerHTML = TICKERS.map(t =>
        `<button class="pill ${t === activeTicker ? 'active' : ''}" onclick="setTicker('${t}')">${t}</button>`
      ).join("");
    }

    function setTab(tab) {
      activeTab = tab;
      ["0dte", "7dte", "weekly", "flow"].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle("active", t === tab);
      });
      renderPills();
      renderView();
    }

    function setTicker(t) {
      activeTicker = t;
      renderPills();
      renderView();
    }

    function setWeeklyMode(mode) {
      weeklyMode = mode;
      renderView();
    }

    function renderScanner7dte() {
      const sc = liveData.scanner_7dte || {};
      const conf = Array.isArray(sc.confluence) ? sc.confluence : [];
      const t5 = sc.top5?.[activeTicker];
      const nodes = Array.isArray(t5?.nodes) ? t5.nodes : [];

      let minG = 0, maxG = 0, minV = 0, maxV = 0;
      [...conf, ...nodes].forEach(item => {
        const g = Number(item.gex) || 0;
        const v = Number(item.vex) || 0;
        if (g < minG) minG = g;
        if (g > maxG) maxG = g;
        if (v < minV) minV = v;
        if (v > maxV) maxV = v;
      });

      return `
        <div class="section-head">7DTE MAGNET CONFLUENCE (BY R:R)<span class="sub">${sc.updated_at || ''}</span></div>
        ${conf.length === 0 ? `<div class="empty-msg">scanner_7dte.confluence is empty in gexvex_live.json.</div>` : `
        <table>
          <thead><tr><th>#</th><th>Sym</th><th>Strike</th><th>GEX</th><th>VEX</th><th>Contract</th><th>R:R</th></tr></thead>
          <tbody>
            ${conf.map((c, idx) => `
              <tr>
                <td>#${idx + 1}</td>
                <td><strong>${c.ticker}</strong>${c.is_magnet ? ' 🧲' : ''}</td>
                <td>$${c.strike} (${fmtPct(c.pct_dist, false)})</td>
                <td style="${heatCellStyle(c.gex, minG, maxG)}">${fmtUsd(c.gex)}</td>
                <td style="${heatCellStyle(c.vex, minV, maxV)}">${fmtUsd(c.vex)}</td>
                <td><span class="${c.side === 'CALL' ? 'badge-call' : 'badge-put'}">${c.side}</span> ${c.price !== '' && c.price !== undefined ? '$' + Number(c.price).toFixed(2) : '—'}</td>
                <td><strong>${c.rr ?? '—'}x</strong></td>
              </tr>
            `).join("")}
          </tbody>
        </table>`}
        <div class="section-head">${activeTicker} TOP-5 ~7DTE NODES (${t5?.expiry || '7DTE'})</div>
        ${nodes.length === 0 ? `<div class="empty-msg">scanner_7dte.top5.${activeTicker}.nodes is empty in gexvex_live.json.</div>` : `
        <table>
          <thead><tr><th>Strike</th><th>%±</th><th>Net GEX</th><th>Net VEX</th><th>Score</th><th>Side / Price</th><th>Flag</th></tr></thead>
          <tbody>
            ${nodes.map(n => `
              <tr>
                <td>$${n.strike}</td>
                <td>${fmtPct(n.pct_dist, false)}</td>
                <td style="${heatCellStyle(n.gex, minG, maxG)}">${fmtUsd(n.gex)}</td>
                <td style="${heatCellStyle(n.vex, minV, maxV)}">${fmtUsd(n.vex)}</td>
                <td>${n.confluence ?? '—'}</td>
                <td><span class="${n.side === 'CALL' ? 'badge-call' : 'badge-put'}">${n.side}</span> ${n.price !== '' && n.price !== undefined ? '$' + Number(n.price).toFixed(2) : '—'}</td>
                <td class="magnet-flag">${n.flag || '—'}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>`}`;
    }

    // ---- All-expiry magnet map (bot: magnet_map, open-interest GEX summed over every expiry) ----
    function fmtSignedPct(v, digits = 0) {
      if (v === null || v === undefined || v === "" || isNaN(v)) return "—";
      const pct = Number(v) * 100;
      const cls = pct > 0 ? "up" : pct < 0 ? "down" : "";
      return `<span class="${cls}">${pct > 0 ? "+" : ""}${pct.toFixed(digits)}%</span>`;
    }

    function fmtStrike(v) {
      return (v === null || v === undefined || v === "") ? "—" : `$${Number(v)}`;
    }

    function magnetNode(p) {
      return (Array.isArray(p?.changes) ? p.changes : []).find(n => n.is_magnet) || null;
    }

    function renderMagnetMap() {
      const mm = liveData.magnet_map || {};
      const tk = mm.tickers || {};
      const head = `<div class="section-head">ALL-EXPIRY MAGNETS<span class="sub">${mm.updated_at || ''}</span></div>`;
      const syms = TICKERS.filter(t => tk[t]);
      if (syms.length === 0) {
        return head + `<div class="empty-msg">No magnet data yet. The bot fills this every 15 min during market hours.</div>`;
      }
      let minG = 0, maxG = 0, minV = 0, maxV = 0;
      syms.forEach(t => {
        const g = Number(tk[t].gex) || 0;
        const v = Number(tk[t].vex) || 0;
        if (g < minG) minG = g;
        if (g > maxG) maxG = g;
        if (v < minV) minV = v;
        if (v > maxV) maxV = v;
      });
      const missing = TICKERS.filter(t => !tk[t]);
      return head + `
        <div class="matrix-scroll"><table>
          <thead><tr><th>Sym</th><th>Spot</th><th>Magnet</th><th>Cum GEX</th><th>Cum VEX</th><th>Strength</th><th>Led</th><th>Status</th></tr></thead>
          <tbody>
            ${syms.map(t => {
              const p = tk[t];
              const mn = magnetNode(p);
              const moved = mn && /NEW/.test(mn.signal || "");
              const str = String(p.strength || "").toLowerCase();
              return `<tr class="${t === activeTicker ? 'active-row' : ''}" onclick="setTicker('${t}')" style="cursor:pointer;">
                <td><strong>${t}</strong></td>
                <td>$${Number(p.spot).toFixed(2)}</td>
                <td class="magnet-flag">🧲 ${fmtStrike(p.magnet)} (${fmtPct(p.pct_dist)})</td>
                <td style="${heatCellStyle(p.gex, minG, maxG)}">${fmtUsd(p.gex)}</td>
                <td style="${heatCellStyle(p.vex, minV, maxV)}">${fmtUsd(p.vex)}${p.vex_rank ? ` <span style="color:#94a3b8;">#${p.vex_rank}</span>` : ''}</td>
                <td class="str-${str}">${p.strength || '—'}</td>
                <td>${p.expiries_led ?? '—'}/${p.expiries_total ?? '—'}</td>
                <td>${moved ? '🔄 ' + ((mn.signal.match(/NEW \(was [^)]*\)/) || ['NEW'])[0]) : 'HELD'}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table></div>
        ${missing.length ? `<div class="empty-msg" style="padding:8px 10px;">No magnet for ${missing.join(", ")}${missing.includes("VIX") ? " (Tradytics has no VIX greeks)" : ""}.</div>` : ""}`;
    }

    // ---- Node growth: top nodes by cumulative |GEX| and how they changed vs the magnet ----
    function renderNodeGrowth() {
      const p = liveData.magnet_map?.tickers?.[activeTicker];
      const head = `<div class="section-head">${activeTicker} NODE GROWTH VS MAGNET${p ? `<span class="sub">magnet ${fmtStrike(p.magnet)}</span>` : ''}</div>`;
      const nodes = Array.isArray(p?.changes) ? p.changes : [];
      if (nodes.length === 0) {
        const why = activeTicker === "VIX" ? "VIX has no magnet data (Tradytics has no VIX greeks)." : `No node data for ${activeTicker} yet.`;
        return head + `<div class="empty-msg">${why}</div>`;
      }
      let minG = 0, maxG = 0, minV = 0, maxV = 0;
      nodes.forEach(n => {
        const g = Number(n.gex) || 0;
        const v = Number(n.vex) || 0;
        if (g < minG) minG = g;
        if (g > maxG) maxG = g;
        if (v < minV) minV = v;
        if (v > maxV) maxV = v;
      });
      return head + `
        <div class="matrix-scroll"><table>
          <thead><tr><th>#</th><th>Strike</th><th>Cum GEX</th><th>% Mag</th><th>Δ 1h</th><th>Δ Day</th><th>Cum VEX</th><th>VEX Δ Day</th><th style="text-align:left;">Signal</th></tr></thead>
          <tbody>
            ${nodes.map(n => `
              <tr class="${n.is_magnet ? 'magnet-row' : ''}">
                <td>${n.rank}</td>
                <td>${fmtStrike(n.strike)} <span style="color:#94a3b8;">(${fmtPct(n.pct_dist)})</span></td>
                <td style="${heatCellStyle(n.gex, minG, maxG)}">${fmtUsd(n.gex)}</td>
                <td>${n.share !== undefined ? Math.round(Number(n.share) * 100) + '%' : '—'}</td>
                <td>${n.share_change_1h === null || n.share_change_1h === undefined ? '—' : `<span class="${n.share_change_1h > 0 ? 'up' : n.share_change_1h < 0 ? 'down' : ''}">${n.share_change_1h > 0 ? '+' : ''}${Math.round(n.share_change_1h * 100)}pt</span>`}</td>
                <td>${fmtSignedPct(n.gex_change_session)}</td>
                <td style="${heatCellStyle(n.vex, minV, maxV)}">${fmtUsd(n.vex)}</td>
                <td>${fmtSignedPct(n.vex_change_session)}</td>
                <td class="signal-cell">${n.signal || '—'}</td>
              </tr>`).join("")}
          </tbody>
        </table></div>
        <div class="empty-msg" style="padding:6px 10px;font-size:10px;">% Mag = node size vs the magnet. Δ 1h = change in that share (points). Δ Day = change in |GEX| vs prior session. VEX Δ Day = change in |VEX| vs prior session. All values are one cumulative amount across every expiry.</div>`;
    }

    // ---- FLOW tab: unusual options flow presets (bot: flow) ----
    const FLOW_PRESETS = [
      ["big", "BIG OPENERS"], ["unusual", "HOW UNUSUAL"], ["accum", "ACCUMULATION"], ["ivx", "IV INFLATION"],
    ];
    const FLOW_DEFAULTS = {
      big: { minPrem: 500000, maxDte: 100, minAsk: 80, sizeOi: true, otm: true, single: true },
      accum: { minDays: 3, minAsk: 0 },
      ivx: { min: 1.3, max: 3, side: "all", sym: "ALL" },
    };
    let flowPreset = "big";
    let flowFilters = JSON.parse(JSON.stringify(FLOW_DEFAULTS));
    try {
      const saved = JSON.parse(localStorage.getItem("gexvex_flow_filters") || "null");
      if (saved) Object.keys(FLOW_DEFAULTS).forEach(k => Object.assign(flowFilters[k], saved[k] || {}));
      flowPreset = localStorage.getItem("gexvex_flow_preset") || "big";
    } catch (e) { /* storage blocked: defaults */ }

    function saveFlowPrefs() {
      try {
        localStorage.setItem("gexvex_flow_filters", JSON.stringify(flowFilters));
        localStorage.setItem("gexvex_flow_preset", flowPreset);
      } catch (e) { /* ignore */ }
    }
    function setFlowPreset(p) { flowPreset = p; saveFlowPrefs(); renderPills(); renderView(); }
    function setFlowFilter(group, key, val) {
      const cur = flowFilters[group][key];
      flowFilters[group][key] = typeof cur === "boolean" ? !!val
        : typeof cur === "number" ? (val === "" || isNaN(Number(val)) ? FLOW_DEFAULTS[group][key] : Number(val)) : val;
      saveFlowPrefs();
      renderView();
    }
    function resetFlowFilters(group) {
      flowFilters[group] = JSON.parse(JSON.stringify(FLOW_DEFAULTS[group]));
      saveFlowPrefs();
      renderView();
    }

    function fmtTimeEt(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", hour12: false });
    }
    function fmtNum(v) {
      if (v === null || v === undefined || v === "" || isNaN(v)) return "—";
      const n = Number(v);
      if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1) + "M";
      if (Math.abs(n) >= 1e4) return (n / 1e3).toFixed(1) + "K";
      return n.toLocaleString("en-US");
    }
    function fmtContract(r, withSym = true) {
      const t = r.type === "call" ? "C" : "P";
      const exp = (r.expiry || "").slice(5).replace("-", "/");
      return `${withSym && r.symbol ? `<strong>${r.symbol}</strong> ` : ""}<span class="${t === 'C' ? 'badge-call' : 'badge-put'}">${Number(r.strike)}${t}</span> <span style="color:#94a3b8;">${exp}</span>`;
    }
    function fmtAsk(v) {
      if (v === null || v === undefined) return "—";
      const n = Number(v);
      const cls = n >= 80 ? "up" : n <= 30 ? "down" : "";
      return `<span class="${cls}">${Math.round(n)}%</span>`;
    }
    function fmtIvx(v) {
      if (v === null || v === undefined) return "—";
      const n = Number(v);
      const cls = n >= 1.3 ? "up" : n <= 0.8 ? "down" : "";
      return `<span class="${cls}">${n.toFixed(2)}x</span>`;
    }
    function flowInput(group, key, label, step = "any", width = 70) {
      return `<label class="flow-field"><span>${label}</span><input type="number" inputmode="decimal" step="${step}" value="${flowFilters[group][key]}" style="width:${width}px;" onchange="setFlowFilter('${group}','${key}',this.value)"></label>`;
    }
    function flowToggle(group, key, label) {
      const on = flowFilters[group][key];
      return `<button class="flow-chip ${on ? 'on' : ''}" onclick="setFlowFilter('${group}','${key}',${!on})">${on ? '✓ ' : ''}${label}</button>`;
    }
    function flowNote(text) { return `<div class="empty-msg" style="padding:6px 10px;font-size:10px;">${text}</div>`; }

    function passesBig(r, f) {
      if (Number(r.premium) < f.minPrem) return false;
      if (f.maxDte > 0 && (r.dte === null || r.dte === undefined || r.dte > f.maxDte)) return false;
      if (f.otm && !r.otm) return false;
      if (f.single && !r.single_leg) return false;
      if (f.sizeOi && !(r.open_interest !== null && r.open_interest !== undefined && r.size > r.open_interest)) return false;
      if (f.minAsk > 0 && (r.ask_pct === null || r.ask_pct === undefined || r.ask_pct < f.minAsk)) return false;
      return true;
    }

    function renderFlowBig(fl) {
      const f = flowFilters.big;
      const all = Array.isArray(fl.big_opening) ? fl.big_opening : [];
      const rows = all.filter(r => passesBig(r, f));
      const controls = `<div class="flow-controls">
          ${flowInput("big", "minPrem", "Min prem $", "50000", 90)}
          ${flowInput("big", "maxDte", "Max DTE", "1", 55)}
          ${flowInput("big", "minAsk", "Ask % ≥", "5", 50)}
          ${flowToggle("big", "sizeOi", "Size > OI")}${flowToggle("big", "otm", "OTM only")}${flowToggle("big", "single", "Single leg")}
          <button class="flow-chip" onclick="resetFlowFilters('big')">Reset</button>
        </div>`;
      const head = `<div class="section-head">LARGE UNUSUAL OPENING ORDERS<span class="sub">${rows.length}/${all.length} · all tickers</span></div>`;
      if (rows.length === 0) {
        return head + controls + `<div class="empty-msg">${all.length ? "No prints pass these filters yet today." : "No $500K+ opening prints yet today. The bot fills this every minute during market hours."}</div>`;
      }
      return head + controls + `<div class="matrix-scroll"><table>
          <thead><tr><th>Time</th><th style="text-align:left;">Contract</th><th>DTE</th><th>Premium</th><th>Size / OI</th><th>Ask %</th><th>Side</th><th>OTM</th><th>IV×</th></tr></thead>
          <tbody>${rows.map(r => `<tr>
              <td>${fmtTimeEt(r.time)}</td>
              <td style="text-align:left;">${fmtContract(r)}</td>
              <td>${r.dte ?? '—'}</td>
              <td><strong>${fmtUsd(r.premium)}</strong></td>
              <td>${fmtNum(r.size)} / ${fmtNum(r.open_interest)}</td>
              <td>${fmtAsk(r.ask_pct)}</td>
              <td class="${r.side === 'bought' ? 'up' : r.side === 'sold' ? 'down' : ''}">${r.side === 'bought' ? 'ASK' : r.side === 'sold' ? 'BID' : 'MID'}${r.kind === 'sweep' ? ' ⚡' : ''}</td>
              <td>${r.otm_pct === null || r.otm_pct === undefined ? '—' : r.otm_pct.toFixed(1) + '%'}</td>
              <td>${fmtIvx(r.iv_x)}</td>
            </tr>`).join("")}</tbody></table></div>`
        + flowNote("$500K+ prints larger than the open interest (opening). Ask % = share of the contract's contracts traded at the ask today, from its $25K+ prints. Side = this print. ⚡ = sweep. IV× only for the bot's tickers.");
    }

    function renderFlowUnusual(fl) {
      const t = fl.unusual?.[activeTicker] || {};
      const head = (title, sub = "") => `<div class="section-head">${activeTicker} ${title}<span class="sub">${sub}</span></div>`;
      const table = (rows, cols, why) => !Array.isArray(rows) || rows.length === 0
        ? `<div class="empty-msg">${why}</div>`
        : `<div class="matrix-scroll"><table><thead><tr><th>#</th><th style="text-align:left;">Contract</th>${cols.map(c => `<th>${c[0]}</th>`).join("")}</tr></thead>
            <tbody>${rows.map((r, i) => `<tr><td>${i + 1}</td><td style="text-align:left;">${fmtContract(r, false)}</td>${cols.map(c => `<td>${c[1](r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      const vol = ["Vol", r => fmtNum(r.volume)], oi = ["OI", r => fmtNum(r.open_interest)];
      const ratio = ["Vol/OI", r => r.vol_oi === null || r.vol_oi === undefined ? "—" : `<strong>${Number(r.vol_oi).toFixed(2)}</strong>`];
      const ask = ["Ask %", r => fmtAsk(r.ask_pct)];
      const chainWhy = "No chain data yet (filled with the magnet map every 15 min).";
      const printWhy = "No $25K+ prints for this ticker yet today.";
      return head("TOP VOLUME", fl.updated_at || "") + table(t.top_volume, [vol, oi, ratio, ask], chainWhy)
        + head("TOP PREMIUM", "$25K+ prints") + table(t.top_premium, [["Premium", r => `<strong>${fmtUsd(r.premium)}</strong>`], ["Prints", r => r.prints], ask], printWhy)
        + head("TOP OPEN INTEREST") + table(t.top_oi, [oi, vol, ratio], chainWhy)
        + head("TOP SWEEP ACTIVITY", "$25K+ sweeps") + table(t.top_sweeps, [["Sweep $", r => `<strong>${fmtUsd(r.sweep_premium)}</strong>`], ["Sweeps", r => r.sweeps], ["Size", r => fmtNum(r.sweep_size)], ask], "No sweeps for this ticker yet today.")
        + head("TOP VOL / OI", "vol ≥ 250") + table(t.top_vol_oi, [ratio, vol, oi, ask], chainWhy)
        + flowNote("Volume, OI and Vol/OI cover strikes inside the magnet map window, out to 130 DTE. Premium and sweeps count today's $25K+ prints on every strike.");
    }

    function renderFlowAccum(fl) {
      const f = flowFilters.accum;
      const all = Array.isArray(fl.accumulation) ? fl.accumulation : [];
      const rows = all.filter(r => r.days >= f.minDays && (f.minAsk <= 0 || (r.ask_pct !== null && r.ask_pct !== undefined && r.ask_pct >= f.minAsk)));
      const sess = Array.isArray(fl.accumulation_sessions) ? fl.accumulation_sessions : [];
      const controls = `<div class="flow-controls">${flowInput("accum", "minDays", "Days in a row ≥", "1", 50)}${flowInput("accum", "minAsk", "Ask % ≥", "5", 50)}
          <button class="flow-chip" onclick="resetFlowFilters('accum')">Reset</button></div>`;
      const head = `<div class="section-head">REPEATED ACCUMULATION (OI +30%/DAY)<span class="sub">${sess.length ? 'through ' + sess[sess.length - 1] : ''}</span></div>`;
      if (rows.length === 0) {
        return head + controls + `<div class="empty-msg">${all.length ? "No contracts meet these filters." : "No OI streaks found. The bot scans past sessions once a day."}</div>`;
      }
      return head + controls + `<div class="matrix-scroll"><table>
          <thead><tr><th style="text-align:left;">Contract</th><th>Days</th><th>OI</th><th>OI Δ</th><th style="text-align:left;">Daily growth</th><th>Premium</th><th>Ask %</th><th>DTE</th></tr></thead>
          <tbody>${rows.map(r => `<tr>
              <td style="text-align:left;">${fmtContract(r)}</td>
              <td><strong>${r.days}</strong></td>
              <td>${fmtNum(r.oi_start)} → ${fmtNum(r.oi_now)}</td>
              <td class="up">${r.oi_growth_total_pct === null || r.oi_growth_total_pct === undefined ? 'new' : '+' + Math.round(r.oi_growth_total_pct) + '%'}</td>
              <td style="text-align:left;">${(r.daily_growth_pct || []).map(g => g === null ? 'new' : '+' + Math.round(g) + '%').join(' · ')}</td>
              <td>${fmtUsd(r.premium)}</td>
              <td>${fmtAsk(r.ask_pct)}</td>
              <td>${r.dte ?? '—'}</td>
            </tr>`).join("")}</tbody></table></div>`
        + flowNote("Open interest grew 30%+ on each of the last N sessions (OI of 300+). Sources: the market's top 1,000 OI gainers per day plus the top 300 for each bot ticker. Ask % = share of the contract's $25K+ prints at the ask since the streak began (top 30 only). Premium and volume sum the streak days.");
    }

    function renderFlowIvx(fl) {
      const f = flowFilters.ivx;
      const all = Array.isArray(fl.iv_inflation) ? fl.iv_inflation : [];
      const rows = all.filter(r => r.iv_x !== null && r.iv_x !== undefined
        && (!f.min || r.iv_x >= f.min) && (!f.max || r.iv_x <= f.max)
        && (f.side === "all" || r.type === f.side) && (f.sym === "ALL" || r.symbol === f.sym))
        .sort((a, b) => b.iv_x - a.iv_x);
      const chip = (key, val, label) => `<button class="flow-chip ${f[key] === val ? 'on' : ''}" onclick="setFlowFilter('ivx','${key}','${val}')">${label}</button>`;
      const controls = `<div class="flow-controls">${flowInput("ivx", "min", "Min ×", "0.1", 50)}${flowInput("ivx", "max", "Max ×", "0.1", 50)}
          ${chip("side", "all", "Calls + puts")}${chip("side", "call", "Calls")}${chip("side", "put", "Puts")}
          ${chip("sym", "ALL", "All")}${(fl.symbols || TICKERS).map(s => chip("sym", s, s)).join("")}
          <button class="flow-chip" onclick="resetFlowFilters('ivx')">Reset</button></div>`;
      const base = fl.iv_baselines || {};
      const baseLine = Object.keys(base).filter(s => base[s]?.call || base[s]?.put)
        .map(s => `${s} C ${base[s].call ? (base[s].call * 100).toFixed(0) + '%' : '—'} / P ${base[s].put ? (base[s].put * 100).toFixed(0) + '%' : '—'}`).join(" · ");
      const head = `<div class="section-head">IV INFLATION (TRADE IV ÷ BASELINE)<span class="sub">${rows.length}/${all.length}</span></div>`;
      if (rows.length === 0) {
        return head + controls + `<div class="empty-msg">${all.length ? "No prints in this range." : "No $100K+ prints with an IV baseline yet today."}</div>` + (baseLine ? flowNote("Baselines: " + baseLine) : "");
      }
      return head + controls + `<div class="matrix-scroll"><table>
          <thead><tr><th>Time</th><th style="text-align:left;">Contract</th><th>IV×</th><th>IV</th><th>Premium</th><th>Side</th><th>Ask %</th><th>DTE</th><th>OTM</th></tr></thead>
          <tbody>${rows.map(r => `<tr>
              <td>${fmtTimeEt(r.time)}</td>
              <td style="text-align:left;">${fmtContract(r)}</td>
              <td><strong>${fmtIvx(r.iv_x)}</strong></td>
              <td>${r.iv ? (r.iv * 100).toFixed(0) + '%' : '—'}</td>
              <td>${fmtUsd(r.premium)}</td>
              <td class="${r.side === 'bought' ? 'up' : r.side === 'sold' ? 'down' : ''}">${r.side === 'bought' ? 'ASK' : r.side === 'sold' ? 'BID' : 'MID'}</td>
              <td>${fmtAsk(r.ask_pct)}</td>
              <td>${r.dte ?? '—'}</td>
              <td>${r.otm_pct === null || r.otm_pct === undefined ? '—' : r.otm_pct.toFixed(1) + '%'}</td>
            </tr>`).join("")}</tbody></table></div>`
        + flowNote("1.0 = normal, 1.5 = 50% richer than usual. Baseline = the ticker's volume-weighted median IV over the last 5 sessions, separately for calls and puts, by expiry (0-7 / 8-30 / 31-100 / 100+ DTE) and moneyness (ATM / 2-8% / 8%+ OTM). $100K+ prints, bot tickers. Overall bases: " + (baseLine || "none yet"));
    }

    function renderFlow() {
      const fl = liveData.flow || {};
      const tabs = `<div class="flow-presets">${FLOW_PRESETS.map(([k, label]) =>
        `<button class="mode-btn ${flowPreset === k ? 'active' : ''}" onclick="setFlowPreset('${k}')">${label}</button>`).join("")}</div>`;
      if (!liveData.flow) {
        return tabs + `<div class="empty-msg">No flow data in gexvex_live.json yet. It appears once the updated bot runs during market hours.</div>`;
      }
      const body = flowPreset === "unusual" ? renderFlowUnusual(fl)
        : flowPreset === "accum" ? renderFlowAccum(fl)
        : flowPreset === "ivx" ? renderFlowIvx(fl) : renderFlowBig(fl);
      return tabs + body;
    }

    function renderView() {
      const box = document.getElementById("viewContainer");
      if (!liveData) {
        box.innerHTML = `<div class="empty-msg">${lastError ? "Fetch error: " + lastError : "Waiting for data..."}</div>`;
        return;
      }

      if (activeTab === "0dte") {
        const d = liveData.zero_dte?.tickers?.[activeTicker];
        if (!d || !Array.isArray(d.rows) || d.rows.length === 0) {
          box.innerHTML = `<div class="empty-msg">No 0DTE rows for ${activeTicker} in gexvex_live.json.</div>`;
          return;
        }
        let spotIdx = -1, minDiff = Infinity;
        let minGex = 0, maxGex = 0, minVex = 0, maxVex = 0;
        d.rows.forEach((r, i) => {
          const diff = Math.abs(Number(r.strike) - Number(d.spot));
          if (diff < minDiff) { minDiff = diff; spotIdx = i; }
          const g = Number(r.gex) || 0;
          const v = Number(r.vex) || 0;
          if (g < minGex) minGex = g;
          if (g > maxGex) maxGex = g;
          if (v < minVex) minVex = v;
          if (v > maxVex) maxVex = v;
        });

        // Ghost node: the all-expiry magnet (white crown), from the bot's magnet_map.
        const ghost = Number(liveData.magnet_map?.tickers?.[activeTicker]?.magnet);
        const hasGhost = Number.isFinite(ghost) && ghost > 0;
        const flip = Number(d.flip);
        const hasFlip = d.flip !== null && d.flip !== undefined && Number.isFinite(flip) && flip > 0;
        const strikes = d.rows.map(r => Number(r.strike));
        const lo = Math.min(...strikes), hi = Math.max(...strikes);
        const spotNum = Number(d.spot);

        // Rows run high to low. Add the flip divider and, when the magnet strike
        // is not already a row, a ghost-only row in its place.
        const items = d.rows.map((r, i) => ({ kind: "row", r, i, k: Number(r.strike) }));
        if (hasGhost && !strikes.includes(ghost) && ghost > lo && ghost < hi) {
          items.splice(items.findIndex(it => it.k < ghost), 0, { kind: "ghost", k: ghost });
        }
        // Expected-move band edges (spot ± ATM straddle) and the flip, as divider rows.
        const em = Number(d.exp_move);
        const hasEm = d.exp_move !== null && d.exp_move !== undefined && Number.isFinite(em) && em > 0;
        const dividers = [];
        if (hasFlip) dividers.push({ kind: "flip", k: flip });
        if (hasEm) {
          dividers.push({ kind: "em", k: spotNum + em, label: `EXP MOVE HIGH $${(spotNum + em).toFixed(2)} (+$${em.toFixed(2)})` });
          dividers.push({ kind: "em", k: spotNum - em, label: `EXP MOVE LOW $${(spotNum - em).toFixed(2)} (−$${em.toFixed(2)})` });
        }
        dividers.filter(dv => dv.k > lo && dv.k < hi).sort((a, b) => b.k - a.k).forEach(dv => {
          // place after any row/ghost at or above it, keeping dividers in strike order
          items.splice(items.findIndex(it => it.k !== undefined && it.k < dv.k), 0, dv);
        });
        const cw = Number(d.call_wall), pw = Number(d.put_wall);
        const wallTags = k =>
          (Number.isFinite(cw) && cw > 0 && k === cw ? '<span class="wall-tag wall-cw">CW</span>' : '') +
          (Number.isFinite(pw) && pw > 0 && k === pw ? '<span class="wall-tag wall-pw">PW</span>' : '');

        const ghostCrown = `<span class="ghost-tag" title="All-expiry magnet">♔</span>`;
        const gexChg = r => (r.g10 === undefined && r.g1h === undefined) ? "" :
          `<div class="chg">${fmtPct(r.g10, true)} · ${fmtPct(r.g1h, true)}</div>`;
        const regimeCls = (d.regime || "").startsWith("+") ? "regime-pos" : "regime-neg";
        const ghostNote = !hasGhost ? "—" :
          `♔ $${ghost}${ghost < lo ? " ↓" : ghost > hi ? " ↑" : ""}`;

        const renderItem = it => {
          if (it.kind === "em") {
            return `<tr class="em-row"><td colspan="6">${it.label}</td></tr>`;
          }
          if (it.kind === "flip") {
            return `<tr class="flip-row"><td colspan="6">0γ FLIP $${flip.toFixed(2)} · +γ above / −γ below</td></tr>`;
          }
          if (it.kind === "ghost") {
            return `<tr class="ghost-row">
              <td>${ghostCrown} $${ghost}${wallTags(ghost)}</td>
              <td>${fmtPct(spotNum ? (ghost - spotNum) / spotNum : "", false)}</td>
              <td colspan="4">all-expiry magnet (not a top 0DTE strike)</td>
            </tr>`;
          }
          const { r, i } = it;
          const isGhost = hasGhost && it.k === ghost;
          return `
            <tr class="${i === spotIdx ? 'spot-row' : ''}">
              <td>${isGhost ? ghostCrown + ' ' : ''}$${r.strike}${wallTags(it.k)}</td>
              <td>${fmtPct(r.pct, false)}</td>
              <td style="${i === spotIdx ? '' : heatCellStyle(r.gex, minGex, maxGex)}" class="${r.gm === '👑' ? 'king-cell' : ''}">${r.gm ? r.gm + ' ' : ''}${fmtUsd(r.gex)}${gexChg(r)}</td>
              <td style="${i === spotIdx ? '' : heatCellStyle(r.vex, minVex, maxVex)}" class="${r.vm === '👑' ? 'king-cell' : ''}">${r.vm ? r.vm + ' ' : ''}${fmtUsd(r.vex)}</td>
              <td>${fmtPct(r.v10, true)}</td>
              <td>${fmtPct(r.v1h, true)}</td>
            </tr>`;
        };

        box.innerHTML = `
          <div class="summary-bar">
            <div class="stat"><span>SPOT (${d.label || "0DTE"})</span><strong>$${spotNum.toFixed(2)}</strong></div>
            <div class="stat"><span>NET GEX</span><strong>${fmtUsd(d.total_gex)}</strong></div>
            <div class="stat"><span>NET VEX</span><strong>${fmtUsd(d.total_vex)}</strong></div>
            <div class="stat"><span>0γ FLIP</span><strong>${hasFlip ? '$' + flip.toFixed(2) : '—'}</strong></div>
            <div class="stat"><span>REGIME</span><strong class="${regimeCls}">${d.regime || '—'}</strong></div>
            <div class="stat"><span>GHOST (ALL-EXP)</span><strong class="ghost-tag">${ghostNote}</strong></div>
            <div class="stat"><span>CALL WALL</span><strong class="up">${Number.isFinite(cw) && cw > 0 ? '$' + cw : '—'}</strong></div>
            <div class="stat"><span>PUT WALL</span><strong class="down">${Number.isFinite(pw) && pw > 0 ? '$' + pw : '—'}</strong></div>
            <div class="stat"><span>EXP MOVE${d.exp_move_expiry ? ' (' + String(d.exp_move_expiry).slice(5) + ')' : ''}</span><strong style="color:#a78bfa;">${hasEm ? '±$' + em.toFixed(2) : '—'}</strong></div>
          </div>
          <table>
            <thead><tr><th>Strike</th><th>%±</th><th>Net GEX<div class="chg">10m · 1h</div></th><th>Net VEX</th><th>VEX 10m</th><th>VEX 1h</th></tr></thead>
            <tbody>
              ${items.map(renderItem).join("")}
            </tbody>
          </table>
          <div class="empty-msg" style="padding:6px 10px;font-size:10px;">👑 0DTE king · ♔ ghost = all-expiry magnet · dashed line = zero gamma flip (cumulative net GEX crosses zero) · dotted purple = expected move (ATM straddle) · CW/PW = call/put wall.</div>`;
      } else if (activeTab === "7dte") {
        box.innerHTML = renderMagnetMap() + renderNodeGrowth() + renderScanner7dte();
      } else if (activeTab === "flow") {
        box.innerHTML = renderFlow();
      } else {
        const w = liveData.weekly || {};
        const exps = Array.isArray(w.expiries) ? w.expiries : [];
        const strikes = Array.isArray(w.strikes) ? w.strikes : [];
        const matrix = weeklyMode === "vex" ? w.vex : w.gex;

        const toggleHeader = `
          <div class="mode-switch">
            <button class="mode-btn ${weeklyMode === 'gex' ? 'active' : ''}" onclick="setWeeklyMode('gex')">WEEKLY OPEX GEX</button>
            <button class="mode-btn ${weeklyMode === 'vex' ? 'active' : ''}" onclick="setWeeklyMode('vex')">WEEKLY OPEX VEX</button>
          </div>`;

        if (strikes.length === 0 || exps.length === 0 || !Array.isArray(matrix)) {
          box.innerHTML = `${toggleHeader}<div class="empty-msg">Weekly ${weeklyMode.toUpperCase()} matrix is empty in gexvex_live.json.</div>`;
          return;
        }

        let minVal = 0, maxVal = 0;
        matrix.forEach(row => {
          if (!Array.isArray(row)) return;
          row.forEach(cell => {
            const v = Number(cell?.v) || 0;
            if (v < minVal) minVal = v;
            if (v > maxVal) maxVal = v;
          });
        });

        let spotIdx = -1, minDiff = Infinity;
        strikes.forEach((k, idx) => {
          const diff = Math.abs(Number(k) - Number(w.spot));
          if (diff < minDiff) { minDiff = diff; spotIdx = idx; }
        });

        box.innerHTML = `
          ${toggleHeader}
          <div class="summary-bar">
            <div class="stat"><span>SPY SPOT</span><strong>$${Number(w.spot || 0).toFixed(2)}</strong></div>
            <div class="stat"><span>LOOKAHEAD</span><strong>${exps.length} DAYS</strong></div>
            <div class="stat"><span>MODE</span><strong>${weeklyMode.toUpperCase()} MATRIX</strong></div>
          </div>
          <div class="matrix-scroll">
            <table class="matrix-table">
              <thead>
                <tr>
                  <th>Strike</th>
                  ${exps.map(e => `<th>${String(e).slice(5)}</th>`).join("")}
                </tr>
              </thead>
              <tbody>
                ${strikes.map((k, rIdx) => {
                  const isSpot = rIdx === spotIdx;
                  return `<tr class="${isSpot ? 'spot-row' : ''}">
                    <td>$${k}</td>
                    ${exps.map((_, cIdx) => {
                      const cell = matrix?.[rIdx]?.[cIdx] || { v: 0, b: "" };
                      const styleAttr = isSpot ? "" : heatCellStyle(cell.v, minVal, maxVal);
                      return `<td style="${styleAttr}" class="${cell.b === '👑' ? 'king-cell' : ''}">${cell.b ? cell.b + ' ' : ''}${fmtUsd(cell.v)}</td>`;
                    }).join("")}
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>`;
      }
    }

    // The GitHub REST API allows only 60 unauthenticated requests/hour per IP,
    // and polling every 30s needs 120. So the API is called once to learn the
    // Gist owner, then polling goes to the raw file URL, which has no such limit.
    const GIST_FILE = "gexvex_live.json";

    async function getGistOwner(gistId) {
      const key = `gexvex_gist_owner_${gistId}`;
      const cached = localStorage.getItem(key);
      if (cached) return cached;
      const res = await fetch(`https://api.github.com/gists/${gistId}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status} looking up Gist`);
      const owner = (await res.json()).owner?.login;
      if (!owner) throw new Error("Could not find the Gist owner");
      localStorage.setItem(key, owner);
      return owner;
    }

    async function fetchGistFile(gistId) {
      const owner = await getGistOwner(gistId);
      // The query string busts GitHub's ~5 minute CDN cache on raw files.
      const url = `https://gist.githubusercontent.com/${owner}/${gistId}/raw/${GIST_FILE}?t=${Date.now()}`;
      const res = await fetch(url, { cache: "no-store" });
      if (res.status === 404) {
        localStorage.removeItem(`gexvex_gist_owner_${gistId}`);
        throw new Error(`${GIST_FILE} missing in Gist`);
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.text();
    }

    async function fetchLive() {
      const gistId = getGistId();
      if (!gistId) {
        document.getElementById("setupScreen").style.display = "block";
        document.getElementById("appContent").style.display = "none";
        return;
      }
      try {
        liveData = JSON.parse(await fetchGistFile(gistId));
        lastError = "";
        renderView();
      } catch (e) {
        lastError = e.message || String(e);
        console.error(e);
        renderView();
      }
      countdown = 30;
      renderStatus();
    }

    setInterval(() => {
      countdown--;
      if (countdown <= 0) fetchLive();
      renderStatus();
    }, 1000);

    renderPills();
    fetchLive();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((e) => console.warn("Service worker not registered:", e));
      });
    }
  </script>
</body>
</html>
